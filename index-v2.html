<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Road Trip · Día 1</title>

  <meta name="theme-color" content="#F6F5F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F6F5F2;
      --surface: #FFFFFF;
      --surface-soft: #F0EEE9;
      --surface-blue: #EDF5F9;

      --text: #1E2428;
      --text-soft: #4E5A62;
      --muted: #7B858C;
      --border: rgba(30, 36, 40, 0.10);

      --primary: #457E9E;
      --primary-soft: #DDECF4;

      --coral: #E77C60;
      --coral-soft: #FBE7E1;

      --gold: #C89537;
      --gold-soft: #FFF3D9;

      --mint: #439A83;
      --mint-soft: #DFF2ED;

      --red: #C95E5E;
      --red-soft: #FCE8E8;

      --shadow:
        0 10px 30px rgba(45, 52, 57, 0.08);

      --shadow-strong:
        0 18px 44px rgba(45, 52, 57, 0.15);

      --safe-top:
        env(safe-area-inset-top);

      --safe-bottom:
        env(safe-area-inset-bottom);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;

      background:
        radial-gradient(
          circle at top right,
          rgba(69, 126, 158, 0.10),
          transparent 34%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        "Sora",
        sans-serif;

      overflow-x: hidden;
    }

    body {
      padding-bottom:
        calc(94px + var(--safe-bottom));
    }

    button {
      font: inherit;
    }

    button,
    article,
    .clickable {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    article:focus-visible {
      outline:
        3px solid
        rgba(69, 126, 158, 0.28);

      outline-offset: 2px;
    }

    /* ─────────────────────────────
       APP
       ───────────────────────────── */

    .app {
      width: 100%;
      min-height: 100vh;
    }

    .loading,
    .error {
      margin: 24px 16px;
      padding: 20px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow: var(--shadow);

      font-size: 16px;
      line-height: 1.55;
    }

    .error {
      color: var(--red);
      background: var(--red-soft);
    }

    /* ─────────────────────────────
       HERO
       ───────────────────────────── */

    .hero {
      position: relative;

      min-height: 300px;

      overflow: hidden;

      border-radius:
        0 0 32px 32px;

      background: #CDD5D9;

      box-shadow: var(--shadow-strong);
    }

    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      filter:
        brightness(0.74)
        saturate(0.96);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(16, 22, 26, 0.08),
          rgba(16, 22, 26, 0.22) 38%,
          rgba(16, 22, 26, 0.82) 100%
        );
    }

    .hero-top {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        calc(14px + var(--safe-top))
        16px 0;
    }

    .round-button {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 50%;

      background: rgba(255,255,255,0.30);

      color: white;

      font-size: 21px;

      cursor: pointer;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 8px 20px rgba(0,0,0,0.12);
    }

    .hero-counter {
      padding: 10px 15px;

      border: 1px solid rgba(255,255,255,0.48);
      border-radius: 24px;

      background: rgba(255,255,255,0.26);

      color: white;

      font-family:
        "Space Mono",
        monospace;

      font-size: 11px;
      font-weight: 700;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .hero-content {
      position: absolute;
      z-index: 2;

      left: 18px;
      right: 18px;
      bottom: 21px;
    }

    .hero-day {
      display: inline-flex;

      margin-bottom: 8px;
      padding: 6px 10px;

      border-radius: 10px;

      background: var(--coral);

      color: white;

      font-family:
        "Space Mono",
        monospace;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .hero-date {
      margin-bottom: 5px;

      color: rgba(255,255,255,0.88);

      font-size: 17px;
      font-weight: 600;

      text-transform: capitalize;
    }

    .hero-title {
      color: white;

      font-size: 35px;
      font-weight: 800;

      line-height: 1.05;
      letter-spacing: -1px;

      text-shadow:
        0 8px 24px rgba(0,0,0,0.20);
    }

    /* ─────────────────────────────
       INFORMACIÓN RÁPIDA
       ───────────────────────────── */

    .glance {
      padding: 18px 16px 0;
    }

    .glance-row {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .glance-card {
      min-width: 0;

      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 21px;

      background: var(--surface);

      box-shadow: var(--shadow);
    }

    .glance-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      margin-bottom: 11px;

      border-radius: 14px;

      background: var(--surface-soft);

      font-size: 21px;
    }

    .glance-label {
      margin-bottom: 5px;

      color: var(--muted);

      font-family:
        "Space Mono",
        monospace;

      font-size: 10px;

      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .glance-value {
      color: var(--text);

      font-size: 15px;
      font-weight: 700;

      line-height: 1.4;
    }

    /* ─────────────────────────────
       SIGUIENTE ACTIVIDAD
       ───────────────────────────── */

    .next-section {
      padding: 12px 16px 0;
    }

    .next-card {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;

      gap: 13px;
      align-items: center;

      padding: 16px;

      border:
        1px solid
        rgba(69, 126, 158, 0.24);

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          var(--primary-soft),
          #FFFFFF
        );

      box-shadow: var(--shadow);

      cursor: pointer;
    }

    .next-icon {
      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background:
        rgba(69, 126, 158, 0.14);

      font-size: 25px;
    }

    .next-content {
      min-width: 0;
    }

    .next-label {
      margin-bottom: 4px;

      color: var(--primary);

      font-family:
        "Space Mono",
        monospace;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .next-name {
      color: var(--text);

      font-size: 18px;
      font-weight: 800;

      line-height: 1.25;
    }

    .next-status {
      margin-top: 4px;

      color: var(--text-soft);

      font-size: 14px;

      line-height: 1.35;
    }

    .next-chevron {
      color: var(--primary);

      font-size: 27px;
    }

    /* ─────────────────────────────
       ALERTA COMPACTA
       ───────────────────────────── */

    .alert-section {
      padding: 12px 16px 0;
    }

    .alert-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      padding: 14px 15px;

      border:
        1px solid
        rgba(201, 94, 94, 0.20);

      border-radius: 19px;

      background: var(--red-soft);
    }

    .alert-icon {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 13px;

      background:
        rgba(201, 94, 94, 0.12);

      font-size: 19px;
    }

    .alert-title {
      margin-bottom: 3px;

      color: #9A4747;

      font-size: 15px;
      font-weight: 700;
    }

    .alert-text {
      color: #7D6060;

      font-size: 13px;
      line-height: 1.45;
    }

    /* ─────────────────────────────
       ITINERARIO
       ───────────────────────────── */

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;

      padding: 25px 16px 13px;
    }

    .section-heading h2 {
      color: var(--text);

      font-size: 27px;
      font-weight: 800;

      letter-spacing: -0.7px;
    }

    .section-heading span {
      color: var(--muted);

      font-family:
        "Space Mono",
        monospace;

      font-size: 11px;
    }

    .itinerary {
      padding: 0 16px 24px;
    }

    .activity {
      margin-bottom: 13px;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 23px;

      background: var(--surface);

      box-shadow: var(--shadow);

      cursor: pointer;

      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .activity:active {
      transform: scale(0.985);

      box-shadow:
        0 5px 18px rgba(45,52,57,0.07);
    }

    .activity.done {
      opacity: 0.52;
    }

    .activity.skipped {
      opacity: 0.34;
    }

    .activity-inner {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        94px;

      gap: 14px;
      align-items: center;

      padding: 16px;
    }

    .activity-info {
      min-width: 0;
    }

    .activity-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 9px;
    }

    .activity-time {
      color: var(--text);

      font-family:
        "Space Mono",
        monospace;

      font-size: 14px;
      font-weight: 700;
    }

    .activity-tag {
      display: inline-flex;
      align-items: center;

      gap: 5px;

      padding: 5px 8px;

      border-radius: 9px;

      font-family:
        "Space Mono",
        monospace;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .c-coral .activity-tag {
      color: #B85E47;
      background: var(--coral-soft);
    }

    .c-gold .activity-tag {
      color: #976D24;
      background: var(--gold-soft);
    }

    .c-mint .activity-tag {
      color: #337B68;
      background: var(--mint-soft);
    }

    .c-sky .activity-tag {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .activity-title {
      color: var(--text);

      font-size: 20px;
      font-weight: 800;

      line-height: 1.25;
    }

    .activity-description {
      margin-top: 5px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.45;

      overflow: hidden;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .activity-media {
      position: relative;
    }

    .activity-image {
      width: 94px;
      height: 94px;

      display: block;

      object-fit: cover;

      border:
        1px solid
        var(--border);

      border-radius: 19px;

      background: var(--surface-soft);
    }

    .activity-chevron {
      position: absolute;

      right: 7px;
      bottom: 7px;

      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border:
        1px solid
        rgba(30,36,40,0.10);

      border-radius: 50%;

      background:
        rgba(255,255,255,0.92);

      color: var(--text);

      font-size: 20px;

      box-shadow:
        0 4px 12px rgba(45,52,57,0.13);
    }

    /* ─────────────────────────────
       TRASLADOS
       ───────────────────────────── */

    .transit {
      display: flex;
      gap: 11px;
      align-items: flex-start;

      margin:
        0 7px 13px;

      padding: 12px 13px;

      border-left:
        3px solid
        rgba(69,126,158,0.48);

      border-radius:
        0 15px 15px 0;

      background:
        rgba(69,126,158,0.07);
    }

    .transit-icon {
      flex: 0 0 auto;

      font-size: 18px;
    }

    .transit-title {
      color: var(--primary);

      font-size: 14px;
      font-weight: 700;

      line-height: 1.4;
    }

    .transit-description {
      margin-top: 3px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.4;
    }

    /* ─────────────────────────────
       HOSPEDAJE
       ───────────────────────────── */

    .hotel-section {
      margin-top: 23px;
    }

    .hotel-label {
      margin-bottom: 11px;

      color: var(--muted);

      font-family:
        "Space Mono",
        monospace;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .hotel-card {
      display: flex;
      gap: 14px;
      align-items: flex-start;

      padding: 17px;

      border:
        1px solid
        rgba(69,126,158,0.20);

      border-radius: 22px;

      background: var(--surface-blue);

      box-shadow: var(--shadow);
    }

    .hotel-icon {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 16px;

      background:
        rgba(69,126,158,0.14);

      font-size: 23px;
    }

    .hotel-content {
      min-width: 0;
      flex: 1;
    }

    .hotel-name {
      color: var(--text);

      font-size: 17px;
      font-weight: 800;

      line-height: 1.35;
    }

    .hotel-description {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.45;
    }

    .hotel-button {
      margin-top: 12px;
      padding: 10px 14px;

      border:
        1px solid
        rgba(69,126,158,0.28);

      border-radius: 20px;

      background:
        rgba(69,126,158,0.11);

      color: var(--primary);

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    /* ─────────────────────────────
       NAVEGACIÓN PRINCIPAL
       ───────────────────────────── */

    .bottom-navigation {
      position: fixed;
      z-index: 50;

      left: 0;
      right: 0;
      bottom: 0;

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        auto
        minmax(0,1fr);

      gap: 10px;
      align-items: center;

      padding:
        11px 16px
        calc(11px + var(--safe-bottom));

      border-top:
        1px solid
        var(--border);

      background:
        rgba(249,248,245,0.96);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 -10px 28px rgba(45,52,57,0.08);
    }

    .nav-button {
      min-width: 0;
      min-height: 52px;

      padding: 11px 13px;

      border:
        1px solid
        var(--border);

      border-radius: 27px;

      background: var(--surface);

      color: var(--text);

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;
    }

    .nav-button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.30;
      cursor: default;
    }

    .nav-day {
      min-width: 70px;

      text-align: center;

      color: var(--muted);

      font-family:
        "Space Mono",
        monospace;
    }

    .nav-day span {
      display: block;

      margin-bottom: 3px;

      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-day strong {
      display: block;

      color: var(--text);

      font-size: 15px;
    }

    /* ─────────────────────────────
       DETALLE FULLSCREEN
       ───────────────────────────── */

    .detail-view {
      position: fixed;
      z-index: 100;

      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow-y: auto;
      overflow-x: hidden;

      background:
        linear-gradient(
          to bottom,
          #FAFAF8,
          var(--bg)
        );

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.22s ease,
        visibility 0.22s ease;

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .detail-view.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .detail-hero {
      position: relative;

      min-height: 370px;

      overflow: hidden;
    }

    .detail-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .detail-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(16,22,26,0.08),
          rgba(16,22,26,0.24) 38%,
          rgba(16,22,26,0.84) 100%
        );
    }

    .detail-top {
      position: absolute;
      z-index: 3;

      top: 0;
      left: 0;
      right: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding:
        calc(14px + var(--safe-top))
        16px 0;
    }

    .detail-position {
      padding: 10px 14px;

      border:
        1px solid
        rgba(255,255,255,0.48);

      border-radius: 24px;

      background:
        rgba(255,255,255,0.26);

      color: white;

      font-family:
        "Space Mono",
        monospace;

      font-size: 10px;
      font-weight: 700;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .detail-heading {
      position: absolute;
      z-index: 2;

      left: 19px;
      right: 19px;
      bottom: 25px;
    }

    .detail-time {
      margin-bottom: 10px;

      color:
        rgba(255,255,255,0.88);

      font-family:
        "Space Mono",
        monospace;

      font-size: 14px;
      font-weight: 700;
    }

    .detail-tag {
      display: inline-flex;

      margin-bottom: 11px;
      padding: 6px 10px;

      border-radius: 9px;

      background:
        rgba(255,255,255,0.20);

      color: white;

      font-family:
        "Space Mono",
        monospace;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 1px;
      text-transform: uppercase;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .detail-title {
      color: white;

      font-size: 34px;
      font-weight: 800;

      line-height: 1.08;
      letter-spacing: -0.9px;
    }

    .detail-description {
      margin-top: 8px;

      color:
        rgba(255,255,255,0.80);

      font-size: 15px;
      line-height: 1.5;
    }

    .detail-content {
      padding:
        22px 16px
        calc(136px + var(--safe-bottom));
    }

    /* Acciones */

    .detail-actions {
      display: grid;
      grid-template-columns:
        1.3fr 1fr 1fr;

      gap: 9px;

      margin-bottom: 30px;
    }

    .detail-action {
      min-height: 68px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      padding: 10px 7px;

      border:
        1px solid
        var(--border);

      border-radius: 20px;

      background: var(--surface);

      color: var(--text);

      box-shadow: var(--shadow);

      cursor: pointer;
    }

    .detail-action.maps {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .detail-action.done {
      border-color:
        rgba(67,154,131,0.25);

      background: var(--mint-soft);
      color: var(--mint);
    }

    .detail-action-icon {
      font-size: 22px;
    }

    .detail-action-label {
      font-size: 12px;
      font-weight: 700;
    }

    /* Secciones */

    .detail-section {
      margin-bottom: 29px;
    }

    .detail-section-label {
      margin-bottom: 11px;

      color: var(--muted);

      font-family:
        "Space Mono",
        monospace;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .detail-box {
      padding: 17px;

      border:
        1px solid
        var(--border);

      border-radius: 21px;

      background: var(--surface);

      box-shadow: var(--shadow);
    }

    .address-box {
      display: flex;
      gap: 13px;
      align-items: flex-start;

      cursor: pointer;
    }

    .box-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 15px;

      background: var(--surface-soft);

      font-size: 21px;
    }

    .address-main {
      color: var(--text);

      font-size: 17px;
      font-weight: 700;

      line-height: 1.45;
    }

    .address-sub {
      margin-top: 5px;

      color: var(--muted);

      font-family:
        "Space Mono",
        monospace;

      font-size: 11px;
      line-height: 1.5;
    }

    .address-link {
      margin-top: 10px;

      color: var(--primary);

      font-size: 14px;
      font-weight: 700;
    }

    .task-list {
      display: flex;
      flex-direction: column;

      padding: 4px 17px;

      border:
        1px solid
        var(--border);

      border-radius: 21px;

      background: var(--surface);

      box-shadow: var(--shadow);
    }

    .task-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      padding: 16px 0;

      color: var(--text-soft);

      font-size: 16px;
      line-height: 1.5;
    }

    .task-item + .task-item {
      border-top:
        1px solid
        var(--border);
    }

    .task-bullet {
      width: 8px;
      height: 8px;

      flex: 0 0 auto;

      margin-top: 8px;

      border-radius: 50%;

      background: var(--primary);
    }

    .c-coral .task-bullet {
      background: var(--coral);
    }

    .c-gold .task-bullet {
      background: var(--gold);
    }

    .c-mint .task-bullet {
      background: var(--mint);
    }

    .price-box {
      display: flex;
      gap: 13px;
      align-items: center;

      border-color:
        rgba(200,149,55,0.22);

      background: var(--gold-soft);
    }

    .price-main {
      color: #916720;

      font-size: 19px;
      font-weight: 800;
    }

    .price-secondary {
      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.4;
    }

    .detail-alert {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      border-color:
        rgba(201,94,94,0.20);

      background: var(--red-soft);

      color: #914B4B;

      font-size: 15px;
      line-height: 1.5;
    }

    /* Navegación detalle */

    .detail-navigation {
      position: fixed;
      z-index: 120;

      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        auto
        minmax(0,1fr);

      gap: 10px;
      align-items: center;

      padding:
        12px 16px
        calc(12px + var(--safe-bottom));

      border-top:
        1px solid
        var(--border);

      background:
        rgba(249,248,245,0.97);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 -12px 30px rgba(45,52,57,0.10);
    }

    .detail-navigation .nav-button {
      min-height: 55px;
    }

    .detail-navigation .nav-button:disabled {
      opacity: 0.27;
      background: transparent;
    }

    /* ─────────────────────────────
       ESCRITORIO
       ───────────────────────────── */

    @media (min-width: 700px) {
      body {
        background:
          radial-gradient(
            circle at top,
            rgba(69,126,158,0.13),
            transparent 40%
          ),
          #E9E7E2;
      }

      .app,
      .detail-view {
        max-width: 470px;
        margin: 0 auto;

        background: var(--bg);

        box-shadow:
          0 0 48px rgba(45,52,57,0.13);
      }

      .bottom-navigation,
      .detail-navigation {
        left: 50%;
        right: auto;

        width: 470px;

        transform:
          translateX(-50%);
      }
    }

    /* ─────────────────────────────
       CELULARES PEQUEÑOS
       ───────────────────────────── */

    @media (max-width: 380px) {
      .hero-title {
        font-size: 31px;
      }

      .glance-row {
        grid-template-columns: 1fr;
      }

      .activity-inner {
        grid-template-columns:
          minmax(0,1fr)
          78px;

        gap: 11px;
      }

      .activity-image {
        width: 78px;
        height: 78px;
      }

      .activity-title {
        font-size: 18px;
      }

      .detail-title {
        font-size: 29px;
      }

      .detail-actions {
        grid-template-columns: 1fr 1fr;
      }

      .detail-action.maps {
        grid-column: 1 / -1;
      }

      .nav-button {
        padding-left: 8px;
        padding-right: 8px;

        font-size: 12px;
      }

      .nav-day {
        min-width: 62px;
      }
    }
  </style>
</head>

<body>

  <main
    class="app"
    id="app"
  >
    <div class="loading">
      ⏳ Cargando Día 1...
    </div>
  </main>

  <section
    class="detail-view"
    id="detailView"
  >
    <div id="detailContent"></div>
  </section>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRjW3k_a-b7btvbmVVbdarfJIUSf4Q3erwqGJf0V6PnFFnOjg1WryzXJmh2Lqywlq6Jg/exec";

    const CURRENT_DAY = 1;

    let rows = [];
    let meta = {};

    let currentDetailOrder = null;
    let mainScrollPosition = 0;

    /* ─────────────────────────────
       UTILIDADES
       ───────────────────────────── */

    function escapeHTML(value) {
      return String(
        value == null
          ? ""
          : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function rowType(row) {
      return String(
        row.tipo || "stop"
      ).toLowerCase();
    }

    function getRow(order) {
      return rows.find(
        row =>
          String(row.orden) ===
          String(order)
      );
    }

    function getStops() {
      return rows.filter(
        row =>
          rowType(row) === "stop"
      );
    }

    function getNight() {
      return rows.find(
        row =>
          rowType(row) === "night"
      );
    }

    function getFirstAlert() {
      return rows.find(
        row =>
          row.alerta
      );
    }

    function stateKey(
      order,
      state
    ) {
      return (
        "roadtrip_day_" +
        CURRENT_DAY +
        "_" +
        order +
        "_" +
        state
      );
    }

    function isDone(row) {
      return (
        localStorage.getItem(
          stateKey(
            row.orden,
            "done"
          )
        ) === "1"
      );
    }

    function isSkipped(row) {
      return (
        localStorage.getItem(
          stateKey(
            row.orden,
            "skipped"
          )
        ) === "1"
      );
    }

    function toggleDone(order) {
      const row =
        getRow(order);

      if (!row) return;

      const doneKey =
        stateKey(order, "done");

      const skippedKey =
        stateKey(order, "skipped");

      if (
        localStorage.getItem(doneKey) ===
        "1"
      ) {
        localStorage.removeItem(doneKey);
      } else {
        localStorage.setItem(
          doneKey,
          "1"
        );

        localStorage.removeItem(
          skippedKey
        );
      }

      render();

      if (
        currentDetailOrder !== null
      ) {
        openDetail(
          currentDetailOrder,
          false
        );
      }
    }

    function toggleSkipped(order) {
      const row =
        getRow(order);

      if (!row) return;

      const skippedKey =
        stateKey(order, "skipped");

      const doneKey =
        stateKey(order, "done");

      if (
        localStorage.getItem(
          skippedKey
        ) === "1"
      ) {
        localStorage.removeItem(
          skippedKey
        );
      } else {
        localStorage.setItem(
          skippedKey,
          "1"
        );

        localStorage.removeItem(
          doneKey
        );
      }

      render();

      if (
        currentDetailOrder !== null
      ) {
        openDetail(
          currentDetailOrder,
          false
        );
      }
    }

    function parseTime(value) {
      const text =
        String(value || "").trim();

      const match =
        text.match(
          /(\d{1,2}):(\d{2})/
        );

      if (!match) {
        return {
          display:
            text ||
            "Horario flexible",

          minutes: null
        };
      }

      const originalHour =
        Number(match[1]);

      const minutes =
        Number(match[2]);

      const displayHour =
        originalHour % 12 || 12;

      const suffix =
        originalHour >= 12
          ? "p.m."
          : "a.m.";

      return {
        display:
          displayHour +
          ":" +
          String(minutes)
            .padStart(2, "0") +
          " " +
          suffix,

        minutes:
          originalHour * 60 +
          minutes
      };
    }

    function currentMinutes() {
      const now =
        new Date();

      return (
        now.getHours() * 60 +
        now.getMinutes()
      );
    }

    function splitTasks(value) {
      if (!value) return [];

      return String(value)
        .split("|")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);
    }

    function numberValue(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      const number =
        Number(
          String(value)
            .replace(",", ".")
        );

      return Number.isNaN(number)
        ? null
        : number;
    }

    function formatMoney(number) {
      return Math
        .round(number)
        .toLocaleString(
          "es-MX"
        );
    }

    function getCurrencyRate(
      currency
    ) {
      const exchange =
        meta.exchange || {};

      if (currency === "USD") {
        return Number(
          exchange.USD_MXN || 0
        );
      }

      if (currency === "CAD") {
        return Number(
          exchange.CAD_MXN || 0
        );
      }

      if (currency === "MXN") {
        return 1;
      }

      return 0;
    }

    /* ─────────────────────────────
       INFORMACIÓN GENERAL
       ───────────────────────────── */

    function formatDate(value) {
      const match =
        String(value || "")
          .match(
            /(\d{4})-(\d{2})-(\d{2})/
          );

      if (!match) {
        return "Lunes 10 de agosto";
      }

      const date =
        new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        );

      return new Intl
        .DateTimeFormat(
          "es-MX",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        )
        .format(date);
    }

    function heroImage() {
      const next =
        getNextStop();

      if (
        next &&
        next.imagen
      ) {
        return next.imagen;
      }

      const first =
        getStops().find(
          row =>
            row.imagen
        );

      return first
        ? first.imagen
        : "https://images.unsplash.com/photo-1502175353174-a7a70e73b362?w=1000&q=80";
    }

    function weatherText() {
      const weather =
        rows.find(
          row =>
            row.weather_display
        );

      return weather
        ? weather.weather_display
        : "Disponible cerca del viaje";
    }

    function getNextStop() {
      const pending =
        getStops().filter(
          row =>
            !isDone(row) &&
            !isSkipped(row)
        );

      const now =
        currentMinutes();

      for (
        const row of pending
      ) {
        const end =
          parseTime(
            row.hora_fin
          ).minutes;

        const start =
          parseTime(
            row.hora_inicio
          ).minutes;

        const reference =
          end !== null
            ? end
            : start;

        if (
          reference !== null &&
          reference >= now
        ) {
          return row;
        }
      }

      return pending[0] || null;
    }

    function getTimeStatus(row) {
      const start =
        parseTime(
          row.hora_inicio
        ).minutes;

      const end =
        parseTime(
          row.hora_fin
        ).minutes;

      const now =
        currentMinutes();

      if (start === null) {
        return "Horario flexible";
      }

      if (now < start) {
        const minutes =
          start - now;

        if (minutes < 60) {
          return (
            "Empieza en " +
            minutes +
            " min"
          );
        }

        return (
          "Programada para " +
          parseTime(
            row.hora_inicio
          ).display
        );
      }

      if (
        end !== null &&
        now > end
      ) {
        return (
          "Esta actividad ya pasó"
        );
      }

      return (
        "Corresponde hacerla ahora"
      );
    }

    function mapsURL(row) {
      const query =
        row.maps_query ||
        row.direccion ||
        row.nombre ||
        "";

      return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query)
      );
    }

    function openMaps(order) {
      const row =
        getRow(order);

      if (!row) return;

      window.open(
        mapsURL(row),
        "_blank"
      );
    }

    /* ─────────────────────────────
       RENDER PRINCIPAL
       ───────────────────────────── */

    function render() {
      const stops =
        getStops();

      const next =
        getNextStop();

      const night =
        getNight();

      const alert =
        getFirstAlert();

      let html = "";

      html += `
        <header class="hero">

          <img
            class="hero-image"
            src="${escapeHTML(heroImage())}"
            alt=""
          >

          <div class="hero-overlay"></div>

          <div class="hero-top">

            <button
              class="round-button"
              type="button"
              disabled
              aria-label="Día anterior"
              style="opacity:.45"
            >
              ‹
            </button>

            <div class="hero-counter">
              Día 1 de 9
            </div>

            <button
              class="round-button"
              type="button"
              onclick="loadData()"
              aria-label="Actualizar"
            >
              ↻
            </button>

          </div>

          <div class="hero-content">

            <div class="hero-day">
              Día 1
            </div>

            <div class="hero-date">
              ${escapeHTML(
                formatDate(
                  meta.fecha
                )
              )}
            </div>

            <h1 class="hero-title">
              ${escapeHTML(
                meta.ciudad ||
                "Llegada / SeaTac"
              )}
            </h1>

          </div>

        </header>
      `;

      html += `
        <section class="glance">

          <div class="glance-row">

            <article class="glance-card">

              <div class="glance-icon">
                🌤️
              </div>

              <div class="glance-label">
                Clima
              </div>

              <div class="glance-value">
                ${escapeHTML(
                  weatherText()
                )}
              </div>

            </article>

            <article class="glance-card">

              <div class="glance-icon">
                🛏️
              </div>

              <div class="glance-label">
                Dormimos en
              </div>

              <div class="glance-value">
                ${
                  night
                    ? escapeHTML(
                        night.nombre ||
                        night.direccion ||
                        "Hospedaje"
                      )
                    : "Holiday Inn Express Sea-Tac"
                }
              </div>

            </article>

          </div>

        </section>
      `;

      if (next) {
        html += `
          <section class="next-section">

            <article
              class="next-card"
              onclick="openDetail('${escapeHTML(next.orden)}')"
            >

              <div class="next-icon">
                ${escapeHTML(
                  next.emoji || "📍"
                )}
              </div>

              <div class="next-content">

                <div class="next-label">
                  Lo que sigue
                </div>

                <div class="next-name">
                  ${escapeHTML(
                    next.nombre || ""
                  )}
                </div>

                <div class="next-status">
                  ${escapeHTML(
                    getTimeStatus(next)
                  )}
                </div>

              </div>

              <div class="next-chevron">
                ›
              </div>

            </article>

          </section>
        `;
      }

      if (alert) {
        html += `
          <section class="alert-section">

            <article class="alert-card">

              <div class="alert-icon">
                ⚠️
              </div>

              <div>

                <div class="alert-title">
                  Importante hoy
                </div>

                <div class="alert-text">
                  ${escapeHTML(
                    alert.alerta
                  )}
                </div>

              </div>

            </article>

          </section>
        `;
      }

      html += `
        <div class="section-heading">

          <h2>
            Itinerario
          </h2>

          <span>
            ${stops.length} actividades
          </span>

        </div>

        <section class="itinerary">
      `;

      rows.forEach(row => {
        const type =
          rowType(row);

        if (
          type === "transit"
        ) {
          html +=
            renderTransit(row);

          return;
        }

        if (
          type === "night"
        ) {
          return;
        }

        html +=
          renderActivity(row);
      });

      if (night) {
        html +=
          renderHotel(night);
      }

      html += `
        </section>

        <nav class="bottom-navigation">

          <button
            class="nav-button"
            disabled
          >
            ← Anterior
          </button>

          <div class="nav-day">
            <span>Día</span>
            <strong>1 de 9</strong>
          </div>

          <button
            class="nav-button primary"
            onclick="alert('En esta prueba solamente está activo el Día 1.')"
          >
            Día 2 →
          </button>

        </nav>
      `;

      document
        .getElementById("app")
        .innerHTML = html;
    }

    function renderActivity(row) {
      const color =
        row.color ||
        "c-coral";

      let classes =
        "activity " +
        color;

      if (
        isDone(row)
      ) {
        classes += " done";
      }

      if (
        isSkipped(row)
      ) {
        classes += " skipped";
      }

      const fallback =
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400&q=75";

      return `
        <article
          class="${classes}"
          onclick="openDetail('${escapeHTML(row.orden)}')"
        >

          <div class="activity-inner">

            <div class="activity-info">

              <div class="activity-meta">

                <span class="activity-time">
                  ${escapeHTML(
                    parseTime(
                      row.hora_inicio
                    ).display
                  )}
                </span>

                <span class="activity-tag">

                  ${escapeHTML(
                    row.emoji || "•"
                  )}

                  ${escapeHTML(
                    row.categoria ||
                    "Actividad"
                  )}

                </span>

              </div>

              <div class="activity-title">
                ${escapeHTML(
                  row.nombre || ""
                )}
              </div>

              ${
                row.descripcion
                  ? `
                    <div class="activity-description">
                      ${escapeHTML(
                        row.descripcion
                      )}
                    </div>
                  `
                  : ""
              }

            </div>

            <div class="activity-media">

              <img
                class="activity-image"
                src="${escapeHTML(
                  row.imagen ||
                  fallback
                )}"
                alt=""
              >

              <span class="activity-chevron">
                ›
              </span>

            </div>

          </div>

        </article>
      `;
    }

    function renderTransit(row) {
      return `
        <div class="transit">

          <div class="transit-icon">
            ${escapeHTML(
              row.emoji || "🚗"
            )}
          </div>

          <div>

            <div class="transit-title">
              ${escapeHTML(
                row.nombre ||
                row.duracion ||
                "Traslado"
              )}
            </div>

            ${
              row.descripcion
                ? `
                  <div class="transit-description">
                    ${escapeHTML(
                      row.descripcion
                    )}
                  </div>
                `
                : ""
            }

          </div>

        </div>
      `;
    }

    function renderHotel(row) {
      return `
        <section class="hotel-section">

          <div class="hotel-label">
            Dónde dormimos
          </div>

          <article class="hotel-card">

            <div class="hotel-icon">
              ${escapeHTML(
                row.emoji || "🏨"
              )}
            </div>

            <div class="hotel-content">

              <div class="hotel-name">
                ${escapeHTML(
                  row.nombre ||
                  "Alojamiento del día"
                )}
              </div>

              ${
                (
                  row.descripcion ||
                  row.direccion
                )
                  ? `
                    <div class="hotel-description">
                      ${escapeHTML(
                        row.descripcion ||
                        row.direccion
                      )}
                    </div>
                  `
                  : ""
              }

              <button
                class="hotel-button"
                type="button"
                onclick="event.stopPropagation(); openMaps('${escapeHTML(row.orden)}')"
              >
                Abrir en Maps
              </button>

            </div>

          </article>

        </section>
      `;
    }

    /* ─────────────────────────────
       DETALLE
       ───────────────────────────── */

    function getPriceConversion(row) {
      const minimum =
        numberValue(
          row.precio_monto
        );

      const maximum =
        numberValue(
          row.precio_monto_max
        );

      const currency =
        String(
          row.moneda || ""
        )
          .toUpperCase()
          .trim();

      const rate =
        getCurrencyRate(
          currency
        );

      if (
        !rate ||
        minimum === null
      ) {
        return "";
      }

      const minimumMXN =
        minimum * rate;

      const maximumMXN =
        (
          maximum !== null
            ? maximum
            : minimum
        ) * rate;

      if (
        maximumMXN >
        minimumMXN
      ) {
        return (
          "Aprox. $" +
          formatMoney(
            minimumMXN
          ) +
          "–$" +
          formatMoney(
            maximumMXN
          ) +
          " MXN"
        );
      }

      return (
        "Aprox. $" +
        formatMoney(
          minimumMXN
        ) +
        " MXN"
      );
    }

    function openDetail(
      order,
      resetScroll = true
    ) {
      const row =
        getRow(order);

      if (!row) return;

      currentDetailOrder =
        order;

      const stops =
        getStops();

      const index =
        stops.findIndex(
          item =>
            String(item.orden) ===
            String(order)
        );

      const previous =
        index > 0
          ? stops[index - 1]
          : null;

      const next =
        index <
        stops.length - 1
          ? stops[index + 1]
          : null;

      const tasks =
        splitTasks(
          row.que_hacer
        );

      const start =
        parseTime(
          row.hora_inicio
        ).display;

      const end =
        row.hora_fin
          ? parseTime(
              row.hora_fin
            ).display
          : "";

      const fallback =
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000&q=80";

      const price =
        row.precio_display ||
        row.precio ||
        "";

      const conversion =
        getPriceConversion(row);

      let html = `
        <div class="detail-hero">

          <img
            class="detail-image"
            src="${escapeHTML(
              row.imagen ||
              fallback
            )}"
            alt=""
          >

          <div class="detail-overlay"></div>

          <div class="detail-top">

            <button
              class="round-button"
              onclick="closeDetail()"
              aria-label="Regresar"
            >
              ←
            </button>

            <div class="detail-position">
              Actividad
              ${index + 1}
              de
              ${stops.length}
            </div>

            <button
              class="round-button"
              onclick="shareActivity('${escapeHTML(row.orden)}')"
              aria-label="Compartir"
            >
              ↗
            </button>

          </div>

          <div class="detail-heading">

            <div class="detail-time">
              ${escapeHTML(start)}
              ${
                end
                  ? " – " +
                    escapeHTML(end)
                  : ""
              }
            </div>

            <div class="detail-tag">

              ${escapeHTML(
                row.emoji || "•"
              )}

              ${escapeHTML(
                row.categoria ||
                "Actividad"
              )}

            </div>

            <h2 class="detail-title">
              ${escapeHTML(
                row.nombre || ""
              )}
            </h2>

            ${
              row.descripcion
                ? `
                  <p class="detail-description">
                    ${escapeHTML(
                      row.descripcion
                    )}
                  </p>
                `
                : ""
            }

          </div>

        </div>

        <div class="detail-content">

          <div class="detail-actions">

            <button
              class="detail-action maps"
              onclick="openMaps('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                🗺️
              </span>

              <span class="detail-action-label">
                Abrir Maps
              </span>
            </button>

            <button
              class="detail-action done"
              onclick="toggleDone('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                ${isDone(row) ? "↩️" : "✅"}
              </span>

              <span class="detail-action-label">
                ${isDone(row) ? "Deshacer" : "Hecho"}
              </span>
            </button>

            <button
              class="detail-action"
              onclick="toggleSkipped('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                ${isSkipped(row) ? "↩️" : "⏭️"}
              </span>

              <span class="detail-action-label">
                ${isSkipped(row) ? "No saltar" : "Saltar"}
              </span>
            </button>

          </div>
      `;

      if (row.direccion) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Dirección
            </div>

            <div
              class="detail-box address-box"
              onclick="openMaps('${escapeHTML(row.orden)}')"
            >

              <div class="box-icon">
                📍
              </div>

              <div>

                <div class="address-main">
                  ${escapeHTML(
                    row.direccion
                  )}
                </div>

                ${
                  row.maps_query
                    ? `
                      <div class="address-sub">
                        ${escapeHTML(
                          row.maps_query
                        )}
                      </div>
                    `
                    : ""
                }

                <div class="address-link">
                  Abrir ubicación →
                </div>

              </div>

            </div>

          </section>
        `;
      }

      if (tasks.length) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Qué hacer aquí
            </div>

            <div
              class="task-list ${escapeHTML(
                row.color ||
                "c-coral"
              )}"
            >
        `;

        tasks.forEach(task => {
          html += `
            <div class="task-item">

              <span class="task-bullet"></span>

              <span>
                ${escapeHTML(task)}
              </span>

            </div>
          `;
        });

        html += `
            </div>

          </section>
        `;
      }

      if (price) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Precio
            </div>

            <div class="detail-box price-box">

              <div class="box-icon">
                💰
              </div>

              <div>

                <div class="price-main">
                  ${escapeHTML(price)}
                </div>

                ${
                  conversion
                    ? `
                      <div class="price-secondary">
                        ${escapeHTML(
                          conversion
                        )}
                      </div>
                    `
                    : ""
                }

                ${
                  row.precio_nota
                    ? `
                      <div class="price-secondary">
                        ${escapeHTML(
                          row.precio_nota
                        )}
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

          </section>
        `;
      }

      if (row.alerta) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Importante
            </div>

            <div class="detail-box detail-alert">

              <span>
                ⚠️
              </span>

              <span>
                ${escapeHTML(
                  row.alerta
                )}
              </span>

            </div>

          </section>
        `;
      }

      html += `
        </div>

        <nav class="detail-navigation">

          <button
            class="nav-button"
            ${
              previous
                ? `onclick="openDetail('${escapeHTML(previous.orden)}')"`
                : "disabled"
            }
          >
            ← Anterior
          </button>

          <div class="nav-day">

            <span>
              Actividad
            </span>

            <strong>
              ${index + 1}
              de
              ${stops.length}
            </strong>

          </div>

          <button
            class="nav-button primary"
            ${
              next
                ? `onclick="openDetail('${escapeHTML(next.orden)}')"`
                : `onclick="closeDetail()"`
            }
          >
            ${next ? "Siguiente →" : "Cerrar ✓"}
          </button>

        </nav>
      `;

      document
        .getElementById(
          "detailContent"
        )
        .innerHTML = html;

      const view =
        document.getElementById(
          "detailView"
        );

      if (
        !view.classList.contains(
          "open"
        )
      ) {
        mainScrollPosition =
          window.scrollY;
      }

      view.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

      if (resetScroll) {
        view.scrollTop = 0;
      }
    }

    function closeDetail() {
      currentDetailOrder =
        null;

      document
        .getElementById(
          "detailView"
        )
        .classList
        .remove("open");

      document.body.style.overflow =
        "";

      window.scrollTo(
        0,
        mainScrollPosition
      );
    }

    function shareActivity(order) {
      const row =
        getRow(order);

      if (!row) return;

      const text = [
        row.nombre ||
          "Actividad del viaje",

        row.hora_inicio
          ? (
            "Hora: " +
            parseTime(
              row.hora_inicio
            ).display
          )
          : "",

        row.direccion || ""
      ]
        .filter(Boolean)
        .join("\n");

      if (navigator.share) {
        navigator
          .share({
            title:
              row.nombre ||
              "Actividad",

            text,

            url:
              mapsURL(row)
          })
          .catch(() => {});
      } else if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {
        navigator.clipboard
          .writeText(
            text +
            "\n" +
            mapsURL(row)
          )
          .then(() => {
            alert(
              "Información copiada."
            );
          })
          .catch(() => {
            alert(text);
          });
      } else {
        alert(text);
      }
    }

    /* ─────────────────────────────
       CARGA
       ───────────────────────────── */

    function loadData() {
      document
        .getElementById(
          "app"
        )
        .innerHTML = `
          <div class="loading">
            ⏳ Cargando Día 1...
          </div>
        `;

      fetch(
        API_URL +
        "?format=json&day=" +
        CURRENT_DAY
      )
        .then(response => {
          if (!response.ok) {
            throw new Error(
              "Error HTTP " +
              response.status
            );
          }

          return response.json();
        })
        .then(data => {
          rows =
            Array.isArray(
              data && data.rows
            )
              ? data.rows
              : [];

          meta =
            data &&
            data.meta
              ? data.meta
              : {};

          if (!rows.length) {
            throw new Error(
              "El API no devolvió actividades para el Día 1."
            );
          }

          render();
        })
        .catch(error => {
          document
            .getElementById(
              "app"
            )
            .innerHTML = `
              <div class="error">

                <strong>
                  No se pudo cargar el Día 1.
                </strong>

                <br><br>

                ${escapeHTML(
                  error.message
                )}

              </div>
            `;
        });
    }

    loadData();
  </script>

</body>
</html>
