<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--page:#ECEFEA;--bg:#F7F7F3;--surface:#fff;--soft:#F0F2EE;--text:#202321;--muted:#7E8781;--border:rgba(32,35,33,.09);--primary:#202321;--blue:#6395B3;--blue-soft:#E2EFF6;--lime:#DFFF59;--lime-soft:#F2FBCB;--coral-soft:#FCE8E1;--gold-soft:#FFF3D7;--green-soft:#E1F3ED;--danger-soft:#FBEAEA;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
html,body{min-height:100%;background:var(--page);color:var(--text);font-family:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:calc(96px + var(--safe-bottom));overflow-x:hidden}body.detail-open{overflow:hidden}button{font:inherit;cursor:pointer}.app{min-height:100vh;background:var(--bg)}.loading,.error{margin:24px 16px;padding:22px;border:1px solid var(--border);border-radius:24px;background:#fff;box-shadow:0 12px 34px rgba(38,45,41,.09)}.error{background:var(--danger-soft)}
.hero{position:relative;min-height:350px;overflow:hidden;border-radius:0 0 38px 38px;background:#B6C6CF}.hero-image,.detail-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-image{filter:brightness(.78) saturate(1.02)}.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,19,17,.04),rgba(14,19,17,.14) 34%,rgba(14,19,17,.86))}.hero-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(16px + var(--safe-top)) 17px 0}.round{width:46px;height:46px;border:1px solid rgba(255,255,255,.48);border-radius:50%;background:rgba(255,255,255,.24);color:#fff;font-size:22px}.hero-count{padding:10px 15px;border:1px solid rgba(255,255,255,.46);border-radius:24px;background:rgba(255,255,255,.23);color:#fff;font-size:12px;font-weight:700}.hero-copy{position:absolute;z-index:2;left:19px;right:19px;bottom:25px;color:#fff}.hero-day{display:inline-flex;margin-bottom:11px;padding:7px 11px;border-radius:12px;background:var(--lime);color:#252A23;font-size:11px;font-weight:800;text-transform:uppercase}.hero-date{font-size:16px;font-weight:600;text-transform:capitalize}.hero-title{margin-top:7px;font-size:clamp(34px,9vw,43px);line-height:1.03;letter-spacing:-1.3px}
.days{display:flex;gap:8px;padding:18px 16px 2px;overflow-x:auto;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{flex:0 0 auto;min-width:75px;padding:10px 12px;border:1px solid var(--border);border-radius:16px;background:#fff}.day strong,.day span{display:block}.day span{margin-top:3px;color:var(--muted);font-size:11px}.day.active{background:var(--primary);color:#fff}.day.active span{color:rgba(255,255,255,.74)}
.section{padding:14px 16px 0}.weather{padding:17px;border:1px solid var(--border);border-radius:25px;background:linear-gradient(135deg,#fff,#F3F8FA);display:flex;gap:14px;align-items:center}.weather-icon{width:58px;height:58px;display:grid;place-items:center;border-radius:19px;background:var(--blue-soft);font-size:29px}.weather small{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.weather strong{display:block;margin-top:7px;font-size:18px}.weather-note{margin-top:6px;color:var(--muted);font-size:11px}
.next{display:grid;grid-template-columns:1fr 104px;gap:15px;min-height:154px;padding:17px;border:1px solid var(--border);border-radius:27px;background:linear-gradient(135deg,var(--lime-soft),#fff 72%)}.next-label{display:inline-block;padding:6px 9px;border-radius:9px;background:var(--lime);font-size:10px;font-weight:800;text-transform:uppercase}.next h3{margin-top:9px;font-size:21px}.next p{margin-top:8px;color:#505853}.media{position:relative;min-height:116px}.thumb{width:100%;height:100%;object-fit:cover;border-radius:21px;background:var(--soft)}.arrow{position:absolute;right:8px;bottom:8px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(32,35,33,.9);color:#fff;font-size:22px}
.alert{margin:13px 16px 0;padding:14px 15px;border:1px solid rgba(200,95,95,.17);border-radius:20px;background:var(--danger-soft)}.heading{display:flex;justify-content:space-between;align-items:end;padding:29px 16px 14px}.heading h2{font-size:30px}.heading span{color:var(--muted);font-size:13px}.list{padding:0 16px 28px}
.card{margin-bottom:14px;overflow:hidden;border:1px solid var(--border);border-radius:27px;background:#fff}.card.done{opacity:.52}.card.skipped{opacity:.33}.card-inner{display:grid;grid-template-columns:1fr 104px;gap:15px;min-height:148px;padding:16px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}.time{font-weight:800}.tag{padding:6px 9px;border-radius:10px;background:var(--coral-soft);font-size:10px;font-weight:800;text-transform:uppercase}.c-sky .tag{background:var(--blue-soft)}.c-gold .tag{background:var(--gold-soft)}.c-mint .tag{background:var(--green-soft)}.title{font-size:20px;font-weight:800;line-height:1.23}.desc{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.48;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.transit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;margin:2px 5px 14px;padding:14px;border:1px solid rgba(99,149,179,.16);border-left:4px solid var(--blue);border-radius:0 20px 20px 0;background:rgba(99,149,179,.08)}.transit-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:rgba(99,149,179,.13);font-size:22px}.route{min-width:58px;min-height:54px;border:1px solid rgba(99,149,179,.24);border-radius:17px;background:#fff;color:#4C7891}.transit small{color:var(--muted)}
.hotel{margin-top:26px;padding:17px;border:1px solid rgba(99,149,179,.18);border-radius:24px;background:#EAF3F8}.hotel h3{font-size:17px}.hotel p{margin-top:5px;color:var(--muted)}
.bottom{position:fixed;z-index:60;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:11px 16px calc(11px + var(--safe-bottom));border-top:1px solid var(--border);background:rgba(250,250,247,.96)}.nav{min-height:52px;border:1px solid var(--border);border-radius:27px;background:#fff;font-weight:800}.nav.primary{background:var(--primary);color:#fff}.nav:disabled{opacity:.3}.pos{text-align:center}.pos small{display:block;color:var(--muted)}
.detail-view{position:fixed;z-index:100;inset:0;height:100dvh;overflow:auto;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;transition:.2s}.detail-view.open{opacity:1;visibility:visible;pointer-events:auto}.detail-hero{position:relative;min-height:400px;overflow:hidden;border-radius:0 0 36px 36px}.detail-head{position:absolute;z-index:2;left:20px;right:20px;bottom:27px;color:#fff}.detail-head h2{font-size:clamp(32px,9vw,42px);line-height:1.06}.detail-body{padding:22px 16px 130px}.detail-actions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:9px;margin-bottom:31px}.action{min-height:72px;border:1px solid var(--border);border-radius:21px;background:#fff;font-weight:800}.action.maps{background:var(--primary);color:#fff}.detail-section{margin-bottom:30px}.detail-section-label{margin-bottom:11px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.box{padding:17px;border:1px solid var(--border);border-radius:23px;background:#fff}.tasks div{padding:15px 0;border-top:1px solid var(--border)}.tasks div:first-child{border-top:0}
@media(min-width:720px){.app,.detail-view{max-width:510px;margin:auto}.bottom{left:50%;right:auto;width:510px;transform:translateX(-50%)}}
</style>
</head>
<body>
<main class="app" id="app"><div class="loading">⏳ Cargando itinerario...</div></main>
<section class="detail-view" id="detailView"><div id="detailContent"></div></section>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxRjW3k_a-b7btvbmVVbdarfJIUSf4Q3erwqGJf0V6PnFFnOjg1WryzXJmh2Lqywlq6Jg/exec";
const TRIP_DAYS={
1:{date:"2026-08-10",shortDate:"10 AGO",city:"SeaTac",latitude:47.4447,longitude:-122.3138,timezone:"America/Los_Angeles",flag:"🇺🇸",country:"Estados Unidos"},
2:{date:"2026-08-11",shortDate:"11 AGO",city:"Seattle",latitude:47.6062,longitude:-122.3321,timezone:"America/Los_Angeles",flag:"🇺🇸",country:"Estados Unidos"},
3:{date:"2026-08-12",shortDate:"12 AGO",city:"Bainbridge / Centralia",latitude:47.6262,longitude:-122.5212,timezone:"America/Los_Angeles",flag:"🇺🇸",country:"Estados Unidos"},
4:{date:"2026-08-13",shortDate:"13 AGO",city:"Portland",latitude:45.5152,longitude:-122.6784,timezone:"America/Los_Angeles",flag:"🇺🇸",country:"Estados Unidos"},
5:{date:"2026-08-14",shortDate:"14 AGO",city:"Victoria",latitude:48.4284,longitude:-123.3656,timezone:"America/Vancouver",flag:"🇨🇦",country:"Canadá"},
6:{date:"2026-08-15",shortDate:"15 AGO",city:"Whistler",latitude:50.1163,longitude:-122.9574,timezone:"America/Vancouver",flag:"🇨🇦",country:"Canadá"},
7:{date:"2026-08-16",shortDate:"16 AGO",city:"Vancouver",latitude:49.2827,longitude:-123.1207,timezone:"America/Vancouver",flag:"🇨🇦",country:"Canadá"},
8:{date:"2026-08-17",shortDate:"17 AGO",city:"Vancouver / Washington",latitude:49.2827,longitude:-123.1207,timezone:"America/Vancouver",flag:"🇨🇦 → 🇺🇸",country:"Canadá a EE. UU."},
9:{date:"2026-08-18",shortDate:"18 AGO",city:"Washington",latitude:47.0379,longitude:-122.9007,timezone:"America/Los_Angeles",flag:"🇺🇸",country:"Estados Unidos"}
};
let currentDay=getAutomaticTripDay(),rows=[],meta={},weatherData=null,weatherUpdatedAt=null,currentDetailOrder=null,mainScrollPosition=0;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function localDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function getAutomaticTripDay(){const t=localDateString(new Date());for(let d=1;d<=9;d++)if(TRIP_DAYS[d].date===t)return d;return t<TRIP_DAYS[1].date?1:t>TRIP_DAYS[9].date?9:1}
function actualTripDay(){const t=localDateString(new Date());for(let d=1;d<=9;d++)if(TRIP_DAYS[d].date===t)return d;return null}
const rowType=r=>String(r.tipo||"stop").toLowerCase(),getRow=o=>rows.find(r=>String(r.orden)===String(o)),stops=()=>rows.filter(r=>rowType(r)==="stop"),night=()=>rows.find(r=>rowType(r)==="night");
function parseTime(v){const s=String(v||"").trim(),m=s.match(/(\d{1,2}):(\d{2})/);if(!m)return{display:s||"Horario flexible",minutes:null};let h=+m[1],mi=+m[2],l=s.toLowerCase();if(l.includes("pm")&&h!==12)h+=12;if(l.includes("am")&&h===12)h=0;return{display:`${h%12||12}:${String(mi).padStart(2,"0")} ${h>=12?"p.m.":"a.m."}`,minutes:h*60+mi}}
function splitTasks(v){return v?String(v).split("|").map(x=>x.trim()).filter(Boolean):[]}
function formatDate(v){const m=String(v||TRIP_DAYS[currentDay].date).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return v;return new Intl.DateTimeFormat("es-MX",{weekday:"long",day:"numeric",month:"long"}).format(new Date(+m[1],+m[2]-1,+m[3]))}
function stateKey(o,s){return `roadtrip_v2_day_${currentDay}_${o}_${s}`}function isDone(r){return localStorage.getItem(stateKey(r.orden,"done"))==="1"}function isSkipped(r){return localStorage.getItem(stateKey(r.orden,"skipped"))==="1"}
function toggleDone(o){const r=getRow(o);if(!r)return;const k=stateKey(o,"done"),s=stateKey(o,"skipped");localStorage.getItem(k)==="1"?localStorage.removeItem(k):(localStorage.setItem(k,"1"),localStorage.removeItem(s));render();if(currentDetailOrder!==null)openDetail(currentDetailOrder,false)}
function toggleSkipped(o){const r=getRow(o);if(!r)return;const k=stateKey(o,"skipped"),d=stateKey(o,"done");localStorage.getItem(k)==="1"?localStorage.removeItem(k):(localStorage.setItem(k,"1"),localStorage.removeItem(d));render();if(currentDetailOrder!==null)openDetail(currentDetailOrder,false)}
function getNextStop(){const p=stops().filter(r=>!isDone(r)&&!isSkipped(r));if(!p.length)return null;if(actualTripDay()!==currentDay)return p[0];const now=new Date().getHours()*60+new Date().getMinutes();return p.find(r=>(parseTime(r.hora_fin).minutes??parseTime(r.hora_inicio).minutes??9999)>=now)||p[0]}
function getTimeStatus(r){if(actualTripDay()!==currentDay)return `A las ${parseTime(r.hora_inicio).display}`;const s=parseTime(r.hora_inicio).minutes,e=parseTime(r.hora_fin).minutes,n=new Date().getHours()*60+new Date().getMinutes();if(s==null)return"Horario flexible";if(n<s)return s-n<60?`Empieza en ${s-n} min`:`A las ${parseTime(r.hora_inicio).display}`;if(e!=null&&n>e)return"Esta actividad ya pasó";return"Corresponde hacerla ahora"}
function heroImage(){const n=getNextStop();return n?.imagen||stops().find(r=>r.imagen)?.imagen||"https://images.unsplash.com/photo-1502175353174-a7a70e73b362?w=1200&q=85"}
function mapsURL(r){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.maps_query||r.direccion||r.nombre||"")}function openMaps(o){const r=getRow(o);if(r)window.open(mapsURL(r),"_blank")}
function transportInfo(r){const t=[r.categoria,r.nombre,r.descripcion,r.emoji].join(" ").toLowerCase();if(t.includes("camin")||t.includes("🚶"))return{icon:"🚶",label:"Caminando",mode:"walking"};if(t.includes("rail")||t.includes("monorriel")||t.includes("tren")||t.includes("🚈")||t.includes("🚝"))return{icon:"🚈",label:"Transporte público",mode:"transit"};if(t.includes("ferry")||t.includes("aquabus")||t.includes("⛴")||t.includes("🛥"))return{icon:"⛴️",label:"Ferry",mode:"transit"};return{icon:"🚗",label:"En auto",mode:"driving"}}
function duration(r){if(r.duracion)return String(r.duracion).replace(/^~/,"").trim();const a=parseTime(r.hora_inicio).minutes,b=parseTime(r.hora_fin).minutes;if(a==null||b==null)return"Por confirmar";let m=b-a;if(m<0)m+=1440;return m>=60?`${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}`:`${m} min`}
function transitURL(r){const ti=transportInfo(r),parts=String(r.nombre||"").split("→"),origin=parts.length>1?parts[0].trim():"",dest=r.maps_query||r.direccion||(parts.length>1?parts.pop().trim():r.nombre);return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest||"")}&travelmode=${ti.mode}${origin?`&origin=${encodeURIComponent(origin)}`:""}`}function openTransit(o){const r=getRow(o);if(r)window.open(transitURL(r),"_blank")}

/* CLIMA: futuro = pronóstico del día; hoy = estado actual + máxima/mínima del día */
function weatherDescription(c){return({0:"Soleado",1:"Mayormente soleado",2:"Parcialmente nublado",3:"Nublado",45:"Nublado",48:"Nublado",51:"Llovizna",53:"Llovizna",55:"Lluvia",61:"Lluvia",63:"Lluvia",65:"Lluvia intensa",71:"Nieve",73:"Nieve",75:"Nieve intensa",80:"Lluvia",81:"Lluvia",82:"Lluvia intensa",95:"Tormenta",96:"Tormenta",99:"Tormenta"}[c]||"Condiciones variables")}
function weatherIcon(c){if(c===0)return"☀️";if([1,2].includes(c))return"🌤️";if([3,45,48].includes(c))return"☁️";if([51,53,55,61,63,65,80,81,82].includes(c))return"🌧️";if([71,73,75].includes(c))return"🌨️";if([95,96,99].includes(c))return"⛈️";return"🌤️"}
async function fetchWeather(){
 const c=TRIP_DAYS[currentDay];weatherData={loading:true,available:false};weatherUpdatedAt=null;
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min&current=weather_code&temperature_unit=celsius&timezone=${encodeURIComponent(c.timezone)}&forecast_days=16`;
 try{
  const data=await fetch(url).then(r=>{if(!r.ok)throw Error("Clima");return r.json()});
  const dates=Array.isArray(data?.daily?.time)?data.daily.time:[],i=dates.indexOf(c.date);
  if(i===-1){weatherData={loading:false,available:false,message:"Pronóstico disponible más cerca de la fecha"};return}
  const isToday=c.date===localDateString(new Date());
  const code=isToday&&typeof data?.current?.weather_code==="number"?data.current.weather_code:data.daily.weather_code[i];
  weatherData={loading:false,available:true,code,maximum:Math.round(data.daily.temperature_2m_max[i]),minimum:Math.round(data.daily.temperature_2m_min[i]),isToday};
  weatherUpdatedAt=new Date();
 }catch{weatherData={loading:false,available:false,message:"No se pudo actualizar el clima"}}
}
function weatherMainText(){if(!weatherData||weatherData.loading)return"Consultando clima...";if(!weatherData.available)return weatherData.message||"Clima no disponible";return `${weatherDescription(weatherData.code)} · ${weatherData.maximum}° / ${weatherData.minimum}°`}
function weatherUpdatedText(){return weatherUpdatedAt?`Actualizado ${weatherUpdatedAt.toLocaleTimeString("es-MX",{hour:"numeric",minute:"2-digit"})}`:""}

function loadDay(d){currentDay=Math.max(1,Math.min(9,+d||1));rows=[];meta={};weatherData=null;weatherUpdatedAt=null;closeDetail(false);scrollTo(0,0);loadData()}
function daysHTML(){let h='<div class="days">';for(let d=1;d<=9;d++)h+=`<button class="day ${d===currentDay?"active":""}" onclick="loadDay(${d})"><strong>${TRIP_DAYS[d].shortDate}</strong><span>Día ${d}</span></button>`;return h+"</div>"}
function render(){
 const ss=stops(),n=getNextStop(),nh=night(),cfg=TRIP_DAYS[currentDay],prev=Math.max(1,currentDay-1),next=Math.min(9,currentDay+1),alert=rows.find(r=>r.alerta);
 let h=`<header class="hero"><img class="hero-image" src="${esc(heroImage())}" alt=""><div class="overlay"></div><div class="hero-top"><button class="round" onclick="loadDay(${prev})" ${currentDay===1?"disabled":""}>‹</button><div class="hero-count">Día ${currentDay} de 9</div><button class="round" onclick="loadData()">↻</button></div><div class="hero-copy"><div class="hero-day">✦ Día ${currentDay}</div><div class="hero-date">${esc(formatDate(meta.fecha||cfg.date))}</div><h1 class="hero-title">${esc(meta.ciudad||cfg.city)}</h1></div></header>${daysHTML()}
 <section class="section"><article class="weather"><div class="weather-icon">${weatherData?.available?weatherIcon(weatherData.code):"🌤️"}</div><div><small>Clima · ${esc(cfg.city)} · ${cfg.flag}</small><strong>${esc(weatherMainText())}</strong>${weatherUpdatedText()?`<div class="weather-note">${esc(weatherUpdatedText())}</div>`:""}</div></article></section>`;
 if(n)h+=`<section class="section"><article class="next" onclick="openDetail('${esc(n.orden)}')"><div><span class="next-label">Lo que sigue</span><h3>${esc(n.nombre)}</h3><p>${esc(getTimeStatus(n))}</p></div><div class="media"><img class="thumb" src="${esc(n.imagen||"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500&q=80")}" alt=""><span class="arrow">›</span></div></article></section>`;
 if(alert)h+=`<div class="alert"><strong>⚠️ Importante hoy</strong><br>${esc(alert.alerta)}</div>`;
 h+=`<div class="heading"><h2>Itinerario</h2><span>${ss.length} actividades</span></div><section class="list">`;
 rows.forEach(r=>{if(rowType(r)==="transit")h+=renderTransit(r);else if(rowType(r)!=="night")h+=renderActivity(r)});
 if(nh)h+=`<article class="hotel"><h3>${esc(nh.emoji||"🏨")} ${esc(nh.nombre||"Alojamiento")}</h3><p>${esc(nh.descripcion||nh.direccion||"")}</p></article>`;
 h+=`</section><nav class="bottom"><button class="nav" onclick="loadDay(${prev})" ${currentDay===1?"disabled":""}>← Día ${prev}</button><div class="pos"><small>Día</small><strong>${currentDay} de 9</strong></div><button class="nav primary" onclick="loadDay(${next})" ${currentDay===9?"disabled":""}>Día ${next} →</button></nav>`;
 document.getElementById("app").innerHTML=h;
}
function renderActivity(r){return `<article class="card ${esc(r.color||"c-coral")} ${isDone(r)?"done":""} ${isSkipped(r)?"skipped":""}" onclick="openDetail('${esc(r.orden)}')"><div class="card-inner"><div><div class="meta"><span class="time">${esc(parseTime(r.hora_inicio).display)}</span><span class="tag">${esc(r.emoji||"•")} ${esc(r.categoria||"Actividad")}</span></div><div class="title">${esc(r.nombre)}</div>${r.descripcion?`<div class="desc">${esc(r.descripcion)}</div>`:""}</div><div class="media"><img class="thumb" src="${esc(r.imagen||"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500&q=80")}" alt=""><span class="arrow">›</span></div></div></article>`}
function renderTransit(r){const t=transportInfo(r);return `<article class="transit"><div class="transit-icon">${t.icon}</div><div><strong>${esc(duration(r))} · ${esc(t.label)}</strong><div>${esc(r.nombre||"Siguiente destino")}</div>${r.descripcion?`<small>${esc(r.descripcion)}</small>`:""}</div><button class="route" onclick="openTransit('${esc(r.orden)}')">🗺️<br><small>Ruta</small></button></article>`}
function openDetail(o,reset=true){
 const r=getRow(o);if(!r)return;currentDetailOrder=o;const ss=stops(),i=ss.findIndex(x=>String(x.orden)===String(o)),tasks=splitTasks(r.que_hacer),start=parseTime(r.hora_inicio).display,end=r.hora_fin?parseTime(r.hora_fin).display:"";
 let h=`<div class="detail-hero"><img class="detail-image" src="${esc(r.imagen||"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200&q=85")}" alt=""><div class="overlay"></div><div class="hero-top"><button class="round" onclick="closeDetail()">←</button><div class="hero-count">${i+1} de ${ss.length}</div><button class="round" onclick="shareActivity('${esc(r.orden)}')">↗</button></div><div class="detail-head"><div>${esc(start)}${end?` – ${esc(end)}`:""}</div><h2>${esc(r.nombre)}</h2>${r.descripcion?`<p>${esc(r.descripcion)}</p>`:""}</div></div><div class="detail-body"><div class="detail-actions"><button class="action maps" onclick="openMaps('${esc(r.orden)}')">🗺️<br>Maps</button><button class="action" onclick="toggleDone('${esc(r.orden)}')">${isDone(r)?"↩️ Deshacer":"✅ Hecho"}</button><button class="action" onclick="toggleSkipped('${esc(r.orden)}')">${isSkipped(r)?"↩️ No saltar":"⏭️ Saltar"}</button></div>`;
 if(r.direccion)h+=`<section class="detail-section"><div class="detail-section-label">Dirección</div><div class="box" onclick="openMaps('${esc(r.orden)}')"><strong>${esc(r.direccion)}</strong>${r.maps_query?`<p>${esc(r.maps_query)}</p>`:""}</div></section>`;
 if(tasks.length)h+=`<section class="detail-section"><div class="detail-section-label">Qué hacer aquí</div><div class="box tasks">${tasks.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div></section>`;
 if(r.precio||r.precio_display)h+=`<section class="detail-section"><div class="detail-section-label">Precio</div><div class="box"><strong>${esc(r.precio_display||r.precio)}</strong></div></section>`;
 if(r.alerta)h+=`<section class="detail-section"><div class="detail-section-label">Importante</div><div class="box">⚠️ ${esc(r.alerta)}</div></section>`;
 h+="</div>";document.getElementById("detailContent").innerHTML=h;const v=document.getElementById("detailView");if(!v.classList.contains("open"))mainScrollPosition=scrollY;v.classList.add("open");document.body.classList.add("detail-open");if(reset)v.scrollTop=0;
}
function closeDetail(restore=true){currentDetailOrder=null;document.getElementById("detailView").classList.remove("open");document.body.classList.remove("detail-open");if(restore)scrollTo(0,mainScrollPosition)}
function shareActivity(o){const r=getRow(o);if(!r)return;const text=[r.nombre,r.hora_inicio?`Hora: ${parseTime(r.hora_inicio).display}`:"",r.direccion||""].filter(Boolean).join("\n");navigator.share?navigator.share({title:r.nombre||"Actividad",text,url:mapsURL(r)}).catch(()=>{}):navigator.clipboard?.writeText(text+"\n"+mapsURL(r))}
async function loadData(){
 document.getElementById("app").innerHTML=`<div class="loading">⏳ Cargando Día ${currentDay}...</div>`;
 try{
  const [data]=await Promise.all([
   fetch(`${API_URL}?format=json&day=${currentDay}&t=${Date.now()}`).then(r=>{if(!r.ok)throw Error("Error HTTP "+r.status);return r.json()}),
   fetchWeather()
  ]);
  rows=Array.isArray(data?.rows)?data.rows:[];meta=data?.meta||{};if(!rows.length)throw Error("El API no devolvió actividades para este día.");render();
 }catch(e){document.getElementById("app").innerHTML=`<div class="error"><strong>No se pudo cargar el Día ${currentDay}.</strong><br><br>${esc(e.message)}</div>`}
}
loadData();
</script>
</body>
</html>
