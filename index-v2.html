<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Road Trip · Día 1</title>

  <meta name="theme-color" content="#F6F7F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --page: #EEF0EC;
      --background: #F7F7F3;
      --surface: #FFFFFF;
      --surface-soft: #F0F2EE;
      --surface-blue: #EAF3F8;

      --text: #202321;
      --text-soft: #505853;
      --muted: #7E8781;
      --border: rgba(32, 35, 33, 0.09);

      --primary: #202321;
      --blue: #6395B3;
      --blue-soft: #E2EFF6;

      --lime: #DFFF59;
      --lime-soft: #F2FBCB;

      --coral: #EF8063;
      --coral-soft: #FCE8E1;

      --gold: #D69A32;
      --gold-soft: #FFF3D7;

      --green: #4B9C84;
      --green-soft: #E1F3ED;

      --danger: #C85F5F;
      --danger-soft: #FBEAEA;

      --shadow-small:
        0 5px 18px rgba(38, 45, 41, 0.07);

      --shadow:
        0 12px 34px rgba(38, 45, 41, 0.09);

      --shadow-strong:
        0 22px 50px rgba(38, 45, 41, 0.16);

      --safe-top:
        env(safe-area-inset-top);

      --safe-bottom:
        env(safe-area-inset-bottom);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(223, 255, 89, 0.18),
          transparent 25%
        ),
        radial-gradient(
          circle at 95% 5%,
          rgba(99, 149, 179, 0.14),
          transparent 30%
        ),
        var(--page);

      color: var(--text);

      font-family:
        "Sora",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
    }

    body {
      padding-bottom:
        calc(94px + var(--safe-bottom));
    }

    button,
    input,
    select,
    textarea {
      font-family:
        "Sora",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    article,
    .clickable {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    article:focus-visible {
      outline:
        3px solid
        rgba(99, 149, 179, 0.30);

      outline-offset: 3px;
    }

    img {
      display: block;
    }

    /* ─────────────────────────────
       APP
       ───────────────────────────── */

    .app {
      width: 100%;
      min-height: 100vh;

      background: var(--background);
    }

    .loading,
    .error {
      margin: 24px 16px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: var(--surface);

      box-shadow: var(--shadow);

      font-size: 16px;
      line-height: 1.55;
    }

    .error {
      color: var(--danger);
      background: var(--danger-soft);
    }

    /* ─────────────────────────────
       HERO
       ───────────────────────────── */

    .hero {
      position: relative;

      min-height: 350px;

      overflow: hidden;

      background: #B6C6CF;

      border-radius:
        0 0 38px 38px;

      box-shadow: var(--shadow-strong);
    }

    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      filter:
        brightness(0.78)
        saturate(1.02);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(14, 19, 17, 0.04),
          rgba(14, 19, 17, 0.14) 34%,
          rgba(14, 19, 17, 0.84) 100%
        );
    }

    .hero-top {
      position: relative;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        calc(16px + var(--safe-top))
        17px
        0;
    }

    .hero-icon-button {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.48);

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.24);

      color: white;

      font-size: 22px;
      font-weight: 600;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.13);
    }

    .hero-icon-button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .hero-count {
      padding: 10px 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.46);

      border-radius: 24px;

      background:
        rgba(255, 255, 255, 0.23);

      color: white;

      font-size: 12px;
      font-weight: 700;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .hero-content {
      position: absolute;
      z-index: 2;

      left: 19px;
      right: 19px;
      bottom: 25px;
    }

    .hero-day {
      display: inline-flex;
      align-items: center;

      gap: 6px;

      margin-bottom: 11px;
      padding: 7px 11px;

      border-radius: 12px;

      background: var(--lime);

      color: #252A23;

      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .hero-date {
      margin-bottom: 7px;

      color:
        rgba(255, 255, 255, 0.90);

      font-size: 16px;
      font-weight: 600;

      text-transform: capitalize;
    }

    .hero-title {
      max-width: 92%;

      color: white;

      font-size: clamp(
        34px,
        9vw,
        43px
      );

      font-weight: 800;

      line-height: 1.03;
      letter-spacing: -1.3px;

      text-shadow:
        0 8px 26px
        rgba(0, 0, 0, 0.22);
    }

    /* ─────────────────────────────
       CONTENIDO GENERAL
       ───────────────────────────── */

    .main-content {
      padding-top: 18px;
    }

    .section-padding {
      padding-left: 16px;
      padding-right: 16px;
    }

    /* ─────────────────────────────
       VISTA RÁPIDA
       ───────────────────────────── */

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 11px;
    }

    .quick-card {
      min-width: 0;

      padding: 16px;

      border:
        1px solid
        var(--border);

      border-radius: 23px;

      background: var(--surface);

      box-shadow: var(--shadow-small);
    }

    .quick-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      margin-bottom: 12px;

      border-radius: 15px;

      background: var(--surface-soft);

      font-size: 22px;
    }

    .quick-label {
      margin-bottom: 6px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .quick-value {
      color: var(--text);

      font-size: 15px;
      font-weight: 700;

      line-height: 1.42;
    }

    /* ─────────────────────────────
       LO QUE SIGUE
       ───────────────────────────── */

    .next-section {
      margin-top: 13px;
    }

    .next-card {
      position: relative;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        104px;

      gap: 15px;
      align-items: stretch;

      min-height: 154px;

      overflow: hidden;

      padding: 17px;

      border:
        1px solid
        rgba(32, 35, 33, 0.09);

      border-radius: 27px;

      background:
        linear-gradient(
          135deg,
          var(--lime-soft),
          #FFFFFF 72%
        );

      box-shadow: var(--shadow);

      cursor: pointer;
    }

    .next-card:active {
      transform: scale(0.99);
    }

    .next-content {
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .next-label {
      display: inline-flex;
      align-items: center;

      width: fit-content;

      margin-bottom: 9px;
      padding: 6px 9px;

      border-radius: 9px;

      background: var(--lime);

      color: #343A2E;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .next-name {
      color: var(--text);

      font-size: 21px;
      font-weight: 800;

      line-height: 1.20;
      letter-spacing: -0.4px;
    }

    .next-time {
      margin-top: 8px;

      color: var(--text-soft);

      font-size: 14px;
      font-weight: 600;

      line-height: 1.4;
    }

    .next-media {
      position: relative;

      min-height: 120px;
    }

    .next-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 21px;

      background: var(--surface-soft);
    }

    .next-arrow {
      position: absolute;

      right: 8px;
      bottom: 8px;

      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--primary);
      color: white;

      font-size: 22px;

      box-shadow:
        0 6px 15px
        rgba(0, 0, 0, 0.18);
    }

    /* ─────────────────────────────
       ALERTA
       ───────────────────────────── */

    .alert-section {
      margin-top: 13px;
    }

    .alert-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      padding: 14px 15px;

      border:
        1px solid
        rgba(200, 95, 95, 0.17);

      border-radius: 20px;

      background: var(--danger-soft);
    }

    .alert-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 14px;

      background:
        rgba(200, 95, 95, 0.11);

      font-size: 20px;
    }

    .alert-title {
      margin-bottom: 3px;

      color: #994A4A;

      font-size: 15px;
      font-weight: 800;
    }

    .alert-text {
      color: #755F5F;

      font-size: 13px;
      line-height: 1.48;
    }

    /* ─────────────────────────────
       ENCABEZADO ITINERARIO
       ───────────────────────────── */

    .itinerary-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;

      padding:
        29px
        16px
        14px;
    }

    .itinerary-heading h2 {
      color: var(--text);

      font-size: 30px;
      font-weight: 800;

      letter-spacing: -0.9px;
    }

    .itinerary-count {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }

    /* ─────────────────────────────
       ACTIVIDADES
       ───────────────────────────── */

    .itinerary-list {
      padding:
        0 16px 28px;
    }

    .activity-card {
      margin-bottom: 14px;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 27px;

      background: var(--surface);

      box-shadow: var(--shadow-small);

      cursor: pointer;

      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .activity-card:active {
      transform: scale(0.987);

      box-shadow:
        0 4px 16px
        rgba(38, 45, 41, 0.06);
    }

    .activity-card.done {
      opacity: 0.52;
    }

    .activity-card.skipped {
      opacity: 0.33;
    }

    .activity-inner {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        104px;

      gap: 15px;
      align-items: stretch;

      min-height: 148px;

      padding: 16px;
    }

    .activity-copy {
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .activity-topline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 11px;
    }

    .activity-time {
      color: var(--text);

      font-size: 15px;
      font-weight: 800;
    }

    .activity-tag {
      display: inline-flex;
      align-items: center;

      gap: 5px;

      padding: 6px 9px;

      border-radius: 10px;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .c-coral .activity-tag {
      color: #B45943;
      background: var(--coral-soft);
    }

    .c-gold .activity-tag {
      color: #96671E;
      background: var(--gold-soft);
    }

    .c-mint .activity-tag {
      color: #337A66;
      background: var(--green-soft);
    }

    .c-sky .activity-tag {
      color: #4E7D98;
      background: var(--blue-soft);
    }

    .activity-title {
      color: var(--text);

      font-size: 20px;
      font-weight: 800;

      line-height: 1.23;
      letter-spacing: -0.4px;
    }

    .activity-description {
      margin-top: 7px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.48;

      overflow: hidden;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .activity-media {
      position: relative;

      min-height: 116px;
    }

    .activity-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 21px;

      background: var(--surface-soft);
    }

    .activity-chevron {
      position: absolute;

      right: 8px;
      bottom: 8px;

      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        rgba(32, 35, 33, 0.88);

      color: white;

      font-size: 22px;

      box-shadow:
        0 5px 15px
        rgba(0, 0, 0, 0.18);
    }

    /* ─────────────────────────────
       TRASLADOS
       ───────────────────────────── */

    .transit-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      margin:
        1px 5px 14px;

      padding:
        13px 14px;

      border-left:
        4px solid
        var(--blue);

      border-radius:
        0 17px 17px 0;

      background:
        rgba(99, 149, 179, 0.08);
    }

    .transit-icon {
      flex: 0 0 auto;

      font-size: 20px;
    }

    .transit-title {
      color: #4C7891;

      font-size: 15px;
      font-weight: 800;

      line-height: 1.4;
    }

    .transit-description {
      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.45;
    }

    /* ─────────────────────────────
       HOTEL
       ───────────────────────────── */

    .hotel-section {
      margin-top: 26px;
    }

    .hotel-label {
      margin-bottom: 11px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .hotel-card {
      position: relative;

      display: grid;
      grid-template-columns:
        56px minmax(0, 1fr);

      gap: 14px;
      align-items: flex-start;

      padding: 17px;

      border:
        1px solid
        rgba(99, 149, 179, 0.18);

      border-radius: 24px;

      background: var(--surface-blue);

      box-shadow: var(--shadow-small);
    }

    .hotel-icon {
      width: 56px;
      height: 56px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background:
        rgba(99, 149, 179, 0.13);

      font-size: 25px;
    }

    .hotel-name {
      color: var(--text);

      font-size: 17px;
      font-weight: 800;

      line-height: 1.35;
    }

    .hotel-description {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.47;
    }

    .hotel-button {
      margin-top: 12px;
      padding: 10px 14px;

      border:
        1px solid
        rgba(99, 149, 179, 0.24);

      border-radius: 19px;

      background:
        rgba(99, 149, 179, 0.11);

      color: #4C7891;

      font-size: 13px;
      font-weight: 800;
    }

    /* ─────────────────────────────
       NAVEGACIÓN PRINCIPAL
       ───────────────────────────── */

    .bottom-navigation {
      position: fixed;
      z-index: 60;

      left: 0;
      right: 0;
      bottom: 0;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

      gap: 10px;
      align-items: center;

      padding:
        11px 16px
        calc(11px + var(--safe-bottom));

      border-top:
        1px solid
        var(--border);

      background:
        rgba(250, 250, 247, 0.95);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 -10px 28px
        rgba(38, 45, 41, 0.08);
    }

    .nav-button {
      min-width: 0;
      min-height: 52px;

      padding: 11px 13px;

      border:
        1px solid
        var(--border);

      border-radius: 27px;

      background: var(--surface);

      color: var(--text);

      font-size: 14px;
      font-weight: 800;

      white-space: nowrap;
    }

    .nav-button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.27;
      cursor: default;
    }

    .nav-position {
      min-width: 70px;

      text-align: center;
    }

    .nav-position span {
      display: block;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .nav-position strong {
      display: block;

      margin-top: 3px;

      color: var(--text);

      font-size: 15px;
      font-weight: 800;
    }

    /* ─────────────────────────────
       DETALLE FULLSCREEN
       ───────────────────────────── */

    .detail-view {
      position: fixed;
      z-index: 100;

      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow-y: auto;
      overflow-x: hidden;

      background:
        linear-gradient(
          to bottom,
          #FAFBF8,
          var(--background)
        );

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.22s ease,
        visibility 0.22s ease;

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .detail-view.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .detail-hero {
      position: relative;

      min-height: 400px;

      overflow: hidden;

      border-radius:
        0 0 36px 36px;
    }

    .detail-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .detail-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(14, 19, 17, 0.04),
          rgba(14, 19, 17, 0.16) 35%,
          rgba(14, 19, 17, 0.88) 100%
        );
    }

    .detail-top {
      position: absolute;
      z-index: 3;

      top: 0;
      left: 0;
      right: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        calc(16px + var(--safe-top))
        17px
        0;
    }

    .detail-position {
      padding: 10px 14px;

      border:
        1px solid
        rgba(255, 255, 255, 0.46);

      border-radius: 23px;

      background:
        rgba(255, 255, 255, 0.23);

      color: white;

      font-size: 11px;
      font-weight: 700;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .detail-heading {
      position: absolute;
      z-index: 2;

      left: 20px;
      right: 20px;
      bottom: 27px;
    }

    .detail-time {
      margin-bottom: 10px;

      color:
        rgba(255, 255, 255, 0.90);

      font-size: 15px;
      font-weight: 700;
    }

    .detail-tag {
      display: inline-flex;
      align-items: center;

      gap: 5px;

      margin-bottom: 12px;
      padding: 7px 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.20);

      color: white;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .detail-title {
      color: white;

      font-size: clamp(
        32px,
        9vw,
        42px
      );

      font-weight: 800;

      line-height: 1.06;
      letter-spacing: -1px;
    }

    .detail-description {
      margin-top: 9px;

      color:
        rgba(255, 255, 255, 0.82);

      font-size: 15px;
      line-height: 1.5;
    }

    .detail-content {
      padding:
        22px 16px
        calc(138px + var(--safe-bottom));
    }

    /* ACCIONES */

    .detail-actions {
      display: grid;
      grid-template-columns:
        1.25fr 1fr 1fr;

      gap: 9px;

      margin-bottom: 31px;
    }

    .detail-action {
      min-height: 72px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 10px 7px;

      border:
        1px solid
        var(--border);

      border-radius: 21px;

      background: var(--surface);

      color: var(--text);

      box-shadow: var(--shadow-small);
    }

    .detail-action.maps {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .detail-action.done {
      border-color:
        rgba(75, 156, 132, 0.23);

      background: var(--green-soft);
      color: #347A68;
    }

    .detail-action-icon {
      font-size: 23px;
    }

    .detail-action-label {
      font-size: 12px;
      font-weight: 800;
    }

    /* SECCIONES DETALLE */

    .detail-section {
      margin-bottom: 30px;
    }

    .detail-section-label {
      margin-bottom: 11px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .detail-box {
      padding: 17px;

      border:
        1px solid
        var(--border);

      border-radius: 23px;

      background: var(--surface);

      box-shadow: var(--shadow-small);
    }

    .address-box {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .detail-icon {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 16px;

      background: var(--surface-soft);

      font-size: 22px;
    }

    .address-main {
      color: var(--text);

      font-size: 17px;
      font-weight: 700;

      line-height: 1.46;
    }

    .address-sub {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.48;
    }

    .address-link {
      margin-top: 10px;

      color: #4C7891;

      font-size: 14px;
      font-weight: 800;
    }

    .task-list {
      padding: 3px 17px;

      border:
        1px solid
        var(--border);

      border-radius: 23px;

      background: var(--surface);

      box-shadow: var(--shadow-small);
    }

    .task-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      padding: 17px 0;

      color: var(--text-soft);

      font-size: 16px;
      line-height: 1.52;
    }

    .task-item + .task-item {
      border-top:
        1px solid
        var(--border);
    }

    .task-bullet {
      width: 8px;
      height: 8px;

      flex: 0 0 auto;

      margin-top: 8px;

      border-radius: 50%;

      background: var(--blue);
    }

    .c-coral .task-bullet {
      background: var(--coral);
    }

    .c-gold .task-bullet {
      background: var(--gold);
    }

    .c-mint .task-bullet {
      background: var(--green);
    }

    .price-box {
      display: flex;
      gap: 14px;
      align-items: center;

      border-color:
        rgba(214, 154, 50, 0.19);

      background: var(--gold-soft);
    }

    .price-main {
      color: #8F631A;

      font-size: 19px;
      font-weight: 800;
    }

    .price-secondary {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.43;
    }

    .detail-alert {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      border-color:
        rgba(200, 95, 95, 0.18);

      background: var(--danger-soft);

      color: #914A4A;

      font-size: 15px;
      line-height: 1.52;
    }

    /* NAVEGACIÓN DETALLE */

    .detail-navigation {
      position: fixed;
      z-index: 120;

      left: 0;
      right: 0;
      bottom: 0;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

      gap: 10px;
      align-items: center;

      padding:
        12px 16px
        calc(12px + var(--safe-bottom));

      border-top:
        1px solid
        var(--border);

      background:
        rgba(250, 250, 247, 0.97);

      backdrop-filter: blur(23px);
      -webkit-backdrop-filter: blur(23px);

      box-shadow:
        0 -12px 32px
        rgba(38, 45, 41, 0.10);
    }

    .detail-navigation .nav-button {
      min-height: 56px;
    }

    /* ─────────────────────────────
       ESCRITORIO
       ───────────────────────────── */

    @media (min-width: 720px) {
      body {
        background:
          radial-gradient(
            circle at 25% 0%,
            rgba(223, 255, 89, 0.20),
            transparent 26%
          ),
          radial-gradient(
            circle at 78% 0%,
            rgba(99, 149, 179, 0.17),
            transparent 30%
          ),
          var(--page);
      }

      .app,
      .detail-view {
        width: 100%;
        max-width: 510px;

        margin-left: auto;
        margin-right: auto;

        background: var(--background);

        box-shadow:
          0 0 55px
          rgba(38, 45, 41, 0.13);
      }

      .bottom-navigation,
      .detail-navigation {
        left: 50%;
        right: auto;

        width: 510px;

        transform:
          translateX(-50%);
      }
    }

    /* ─────────────────────────────
       MÓVILES PEQUEÑOS
       ───────────────────────────── */

    @media (max-width: 385px) {
      .hero {
        min-height: 325px;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .next-card,
      .activity-inner {
        grid-template-columns:
          minmax(0, 1fr)
          88px;

        gap: 11px;
      }

      .next-name {
        font-size: 19px;
      }

      .activity-title {
        font-size: 18px;
      }

      .detail-actions {
        grid-template-columns: 1fr 1fr;
      }

      .detail-action.maps {
        grid-column: 1 / -1;
      }

      .nav-button {
        padding-left: 8px;
        padding-right: 8px;

        font-size: 12px;
      }

      .nav-position {
        min-width: 59px;
      }
    }
  </style>
</head>

<body>

  <main
    class="app"
    id="app"
  >
    <div class="loading">
      ⏳ Cargando Día 1...
    </div>
  </main>

  <section
    class="detail-view"
    id="detailView"
  >
    <div id="detailContent"></div>
  </section>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRjW3k_a-b7btvbmVVbdarfJIUSf4Q3erwqGJf0V6PnFFnOjg1WryzXJmh2Lqywlq6Jg/exec";

    const CURRENT_DAY = 1;

    let rows = [];
    let meta = {};

    let currentDetailOrder = null;
    let mainScrollPosition = 0;

    function escapeHTML(value) {
      return String(
        value == null
          ? ""
          : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function rowType(row) {
      return String(
        row.tipo || "stop"
      ).toLowerCase();
    }

    function getRow(order) {
      return rows.find(
        row =>
          String(row.orden) ===
          String(order)
      );
    }

    function getStops() {
      return rows.filter(
        row =>
          rowType(row) === "stop"
      );
    }

    function getNight() {
      return rows.find(
        row =>
          rowType(row) === "night"
      );
    }

    function getFirstAlert() {
      return rows.find(
        row =>
          row.alerta
      );
    }

    function stateKey(
      order,
      state
    ) {
      return (
        "roadtrip_v2_day_" +
        CURRENT_DAY +
        "_" +
        order +
        "_" +
        state
      );
    }

    function isDone(row) {
      return (
        localStorage.getItem(
          stateKey(
            row.orden,
            "done"
          )
        ) === "1"
      );
    }

    function isSkipped(row) {
      return (
        localStorage.getItem(
          stateKey(
            row.orden,
            "skipped"
          )
        ) === "1"
      );
    }

    function toggleDone(order) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      const doneKey =
        stateKey(
          order,
          "done"
        );

      const skippedKey =
        stateKey(
          order,
          "skipped"
        );

      if (
        localStorage.getItem(
          doneKey
        ) === "1"
      ) {
        localStorage.removeItem(
          doneKey
        );
      } else {
        localStorage.setItem(
          doneKey,
          "1"
        );

        localStorage.removeItem(
          skippedKey
        );
      }

      render();

      if (
        currentDetailOrder !== null
      ) {
        openDetail(
          currentDetailOrder,
          false
        );
      }
    }

    function toggleSkipped(order) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      const skippedKey =
        stateKey(
          order,
          "skipped"
        );

      const doneKey =
        stateKey(
          order,
          "done"
        );

      if (
        localStorage.getItem(
          skippedKey
        ) === "1"
      ) {
        localStorage.removeItem(
          skippedKey
        );
      } else {
        localStorage.setItem(
          skippedKey,
          "1"
        );

        localStorage.removeItem(
          doneKey
        );
      }

      render();

      if (
        currentDetailOrder !== null
      ) {
        openDetail(
          currentDetailOrder,
          false
        );
      }
    }

    function parseTime(value) {
      const text =
        String(value || "").trim();

      const match =
        text.match(
          /(\d{1,2}):(\d{2})/
        );

      if (!match) {
        return {
          display:
            text ||
            "Horario flexible",

          minutes: null
        };
      }

      const originalHour =
        Number(match[1]);

      const minutes =
        Number(match[2]);

      const displayHour =
        originalHour % 12 || 12;

      const suffix =
        originalHour >= 12
          ? "p.m."
          : "a.m.";

      return {
        display:
          displayHour +
          ":" +
          String(minutes)
            .padStart(2, "0") +
          " " +
          suffix,

        minutes:
          originalHour * 60 +
          minutes
      };
    }

    function currentMinutes() {
      const now =
        new Date();

      return (
        now.getHours() * 60 +
        now.getMinutes()
      );
    }

    function splitTasks(value) {
      if (!value) {
        return [];
      }

      return String(value)
        .split("|")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);
    }

    function numberValue(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      const number =
        Number(
          String(value)
            .replace(",", ".")
        );

      return Number.isNaN(number)
        ? null
        : number;
    }

    function formatMoney(number) {
      return Math
        .round(number)
        .toLocaleString(
          "es-MX"
        );
    }

    function getCurrencyRate(
      currency
    ) {
      const exchange =
        meta.exchange || {};

      if (currency === "USD") {
        return Number(
          exchange.USD_MXN || 0
        );
      }

      if (currency === "CAD") {
        return Number(
          exchange.CAD_MXN || 0
        );
      }

      if (currency === "MXN") {
        return 1;
      }

      return 0;
    }

    function formatDate(value) {
      const match =
        String(value || "")
          .match(
            /(\d{4})-(\d{2})-(\d{2})/
          );

      if (!match) {
        return "Lunes 10 de agosto";
      }

      const date =
        new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        );

      return new Intl
        .DateTimeFormat(
          "es-MX",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        )
        .format(date);
    }

    function getNextStop() {
      const pending =
        getStops().filter(
          row =>
            !isDone(row) &&
            !isSkipped(row)
        );

      const now =
        currentMinutes();

      for (
        const row of pending
      ) {
        const end =
          parseTime(
            row.hora_fin
          ).minutes;

        const start =
          parseTime(
            row.hora_inicio
          ).minutes;

        const reference =
          end !== null
            ? end
            : start;

        if (
          reference !== null &&
          reference >= now
        ) {
          return row;
        }
      }

      return pending[0] || null;
    }

    function getTimeStatus(row) {
      const start =
        parseTime(
          row.hora_inicio
        ).minutes;

      const end =
        parseTime(
          row.hora_fin
        ).minutes;

      const now =
        currentMinutes();

      if (
        start === null
      ) {
        return "Horario flexible";
      }

      if (
        now < start
      ) {
        const remaining =
          start - now;

        if (
          remaining < 60
        ) {
          return (
            "Empieza en " +
            remaining +
            " min"
          );
        }

        return (
          "A las " +
          parseTime(
            row.hora_inicio
          ).display
        );
      }

      if (
        end !== null &&
        now > end
      ) {
        return (
          "Esta actividad ya pasó"
        );
      }

      return (
        "Corresponde hacerla ahora"
      );
    }

    function heroImage() {
      const next =
        getNextStop();

      if (
        next &&
        next.imagen
      ) {
        return next.imagen;
      }

      const first =
        getStops().find(
          row =>
            row.imagen
        );

      return first
        ? first.imagen
        : "https://images.unsplash.com/photo-1502175353174-a7a70e73b362?w=1200&q=85";
    }

    function weatherText() {
      const weather =
        rows.find(
          row =>
            row.weather_display
        );

      return weather
        ? weather.weather_display
        : "Disponible cerca de la fecha del viaje";
    }

    function mapsURL(row) {
      const query =
        row.maps_query ||
        row.direccion ||
        row.nombre ||
        "";

      return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query)
      );
    }

    function openMaps(order) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      window.open(
        mapsURL(row),
        "_blank"
      );
    }

    function render() {
      const stops =
        getStops();

      const next =
        getNextStop();

      const night =
        getNight();

      const alert =
        getFirstAlert();

      let html = "";

      html += `
        <header class="hero">

          <img
            class="hero-image"
            src="${escapeHTML(heroImage())}"
            alt=""
          >

          <div class="hero-overlay"></div>

          <div class="hero-top">

            <button
              class="hero-icon-button"
              type="button"
              disabled
              aria-label="Día anterior"
            >
              ‹
            </button>

            <div class="hero-count">
              Día 1 de 9
            </div>

            <button
              class="hero-icon-button"
              type="button"
              onclick="loadData()"
              aria-label="Actualizar"
            >
              ↻
            </button>

          </div>

          <div class="hero-content">

            <div class="hero-day">
              ✦ Día 1
            </div>

            <div class="hero-date">
              ${escapeHTML(
                formatDate(
                  meta.fecha
                )
              )}
            </div>

            <h1 class="hero-title">
              ${escapeHTML(
                meta.ciudad ||
                "Llegada / SeaTac"
              )}
            </h1>

          </div>

        </header>
      `;

      html += `
        <div class="main-content">

          <section class="section-padding">

            <div class="quick-grid">

              <article class="quick-card">

                <div class="quick-icon">
                  🌤️
                </div>

                <div class="quick-label">
                  Clima
                </div>

                <div class="quick-value">
                  ${escapeHTML(
                    weatherText()
                  )}
                </div>

              </article>

              <article class="quick-card">

                <div class="quick-icon">
                  🛏️
                </div>

                <div class="quick-label">
                  Dormimos en
                </div>

                <div class="quick-value">
                  ${
                    night
                      ? escapeHTML(
                          night.nombre ||
                          night.direccion ||
                          "Hospedaje"
                        )
                      : "Holiday Inn Express Sea-Tac"
                  }
                </div>

              </article>

            </div>

          </section>
      `;

      if (next) {
        html += `
          <section class="section-padding next-section">

            <article
              class="next-card"
              onclick="openDetail('${escapeHTML(next.orden)}')"
            >

              <div class="next-content">

                <div class="next-label">
                  Lo que sigue
                </div>

                <div class="next-name">
                  ${escapeHTML(
                    next.nombre || ""
                  )}
                </div>

                <div class="next-time">
                  ${escapeHTML(
                    getTimeStatus(next)
                  )}
                </div>

              </div>

              <div class="next-media">

                <img
                  class="next-image"
                  src="${escapeHTML(
                    next.imagen ||
                    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500&q=80"
                  )}"
                  alt=""
                >

                <span class="next-arrow">
                  ›
                </span>

              </div>

            </article>

          </section>
        `;
      }

      if (alert) {
        html += `
          <section class="section-padding alert-section">

            <article class="alert-card">

              <div class="alert-icon">
                ⚠️
              </div>

              <div>

                <div class="alert-title">
                  Importante hoy
                </div>

                <div class="alert-text">
                  ${escapeHTML(
                    alert.alerta
                  )}
                </div>

              </div>

            </article>

          </section>
        `;
      }

      html += `
          <div class="itinerary-heading">

            <h2>
              Itinerario
            </h2>

            <div class="itinerary-count">
              ${stops.length} actividades
            </div>

          </div>

          <section class="itinerary-list">
      `;

      rows.forEach(row => {
        const type =
          rowType(row);

        if (
          type === "transit"
        ) {
          html +=
            renderTransit(row);

          return;
        }

        if (
          type === "night"
        ) {
          return;
        }

        html +=
          renderActivity(row);
      });

      if (night) {
        html +=
          renderHotel(night);
      }

      html += `
          </section>

        </div>

        <nav class="bottom-navigation">

          <button
            class="nav-button"
            disabled
          >
            ← Anterior
          </button>

          <div class="nav-position">
            <span>Día</span>
            <strong>1 de 9</strong>
          </div>

          <button
            class="nav-button primary"
            onclick="alert('Esta prueba solamente contiene el Día 1.')"
          >
            Día 2 →
          </button>

        </nav>
      `;

      document
        .getElementById("app")
        .innerHTML = html;
    }

    function renderActivity(row) {
      const color =
        row.color ||
        "c-coral";

      let classes =
        "activity-card " +
        color;

      if (
        isDone(row)
      ) {
        classes +=
          " done";
      }

      if (
        isSkipped(row)
      ) {
        classes +=
          " skipped";
      }

      const fallback =
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500&q=80";

      return `
        <article
          class="${classes}"
          onclick="openDetail('${escapeHTML(row.orden)}')"
        >

          <div class="activity-inner">

            <div class="activity-copy">

              <div class="activity-topline">

                <span class="activity-time">
                  ${escapeHTML(
                    parseTime(
                      row.hora_inicio
                    ).display
                  )}
                </span>

                <span class="activity-tag">

                  ${escapeHTML(
                    row.emoji || "•"
                  )}

                  ${escapeHTML(
                    row.categoria ||
                    "Actividad"
                  )}

                </span>

              </div>

              <div class="activity-title">
                ${escapeHTML(
                  row.nombre || ""
                )}
              </div>

              ${
                row.descripcion
                  ? `
                    <div class="activity-description">
                      ${escapeHTML(
                        row.descripcion
                      )}
                    </div>
                  `
                  : ""
              }

            </div>

            <div class="activity-media">

              <img
                class="activity-image"
                src="${escapeHTML(
                  row.imagen ||
                  fallback
                )}"
                alt=""
              >

              <span class="activity-chevron">
                ›
              </span>

            </div>

          </div>

        </article>
      `;
    }

    function renderTransit(row) {
      return `
        <div class="transit-card">

          <div class="transit-icon">
            ${escapeHTML(
              row.emoji || "🚗"
            )}
          </div>

          <div>

            <div class="transit-title">
              ${escapeHTML(
                row.nombre ||
                row.duracion ||
                "Traslado"
              )}
            </div>

            ${
              row.descripcion
                ? `
                  <div class="transit-description">
                    ${escapeHTML(
                      row.descripcion
                    )}
                  </div>
                `
                : ""
            }

          </div>

        </div>
      `;
    }

    function renderHotel(row) {
      return `
        <section class="hotel-section">

          <div class="hotel-label">
            Dónde dormimos
          </div>

          <article class="hotel-card">

            <div class="hotel-icon">
              ${escapeHTML(
                row.emoji || "🏨"
              )}
            </div>

            <div>

              <div class="hotel-name">
                ${escapeHTML(
                  row.nombre ||
                  "Alojamiento del día"
                )}
              </div>

              ${
                (
                  row.descripcion ||
                  row.direccion
                )
                  ? `
                    <div class="hotel-description">
                      ${escapeHTML(
                        row.descripcion ||
                        row.direccion
                      )}
                    </div>
                  `
                  : ""
              }

              <button
                class="hotel-button"
                type="button"
                onclick="event.stopPropagation(); openMaps('${escapeHTML(row.orden)}')"
              >
                Abrir en Maps
              </button>

            </div>

          </article>

        </section>
      `;
    }

    function getPriceConversion(row) {
      const minimum =
        numberValue(
          row.precio_monto
        );

      const maximum =
        numberValue(
          row.precio_monto_max
        );

      const currency =
        String(
          row.moneda || ""
        )
          .toUpperCase()
          .trim();

      const rate =
        getCurrencyRate(
          currency
        );

      if (
        !rate ||
        minimum === null
      ) {
        return "";
      }

      const minimumMXN =
        minimum * rate;

      const maximumMXN =
        (
          maximum !== null
            ? maximum
            : minimum
        ) * rate;

      if (
        maximumMXN >
        minimumMXN
      ) {
        return (
          "Aprox. $" +
          formatMoney(
            minimumMXN
          ) +
          "–$" +
          formatMoney(
            maximumMXN
          ) +
          " MXN"
        );
      }

      return (
        "Aprox. $" +
        formatMoney(
          minimumMXN
        ) +
        " MXN"
      );
    }

    function openDetail(
      order,
      resetScroll = true
    ) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      currentDetailOrder =
        order;

      const stops =
        getStops();

      const index =
        stops.findIndex(
          item =>
            String(item.orden) ===
            String(order)
        );

      const previous =
        index > 0
          ? stops[index - 1]
          : null;

      const next =
        index <
        stops.length - 1
          ? stops[index + 1]
          : null;

      const tasks =
        splitTasks(
          row.que_hacer
        );

      const start =
        parseTime(
          row.hora_inicio
        ).display;

      const end =
        row.hora_fin
          ? parseTime(
              row.hora_fin
            ).display
          : "";

      const fallback =
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200&q=85";

      const price =
        row.precio_display ||
        row.precio ||
        "";

      const conversion =
        getPriceConversion(row);

      let html = `
        <div class="detail-hero">

          <img
            class="detail-image"
            src="${escapeHTML(
              row.imagen ||
              fallback
            )}"
            alt=""
          >

          <div class="detail-overlay"></div>

          <div class="detail-top">

            <button
              class="hero-icon-button"
              onclick="closeDetail()"
              aria-label="Regresar"
            >
              ←
            </button>

            <div class="detail-position">
              ${index + 1} de ${stops.length}
            </div>

            <button
              class="hero-icon-button"
              onclick="shareActivity('${escapeHTML(row.orden)}')"
              aria-label="Compartir"
            >
              ↗
            </button>

          </div>

          <div class="detail-heading">

            <div class="detail-time">
              ${escapeHTML(start)}

              ${
                end
                  ? " – " +
                    escapeHTML(end)
                  : ""
              }
            </div>

            <div class="detail-tag">

              ${escapeHTML(
                row.emoji || "•"
              )}

              ${escapeHTML(
                row.categoria ||
                "Actividad"
              )}

            </div>

            <h2 class="detail-title">
              ${escapeHTML(
                row.nombre || ""
              )}
            </h2>

            ${
              row.descripcion
                ? `
                  <p class="detail-description">
                    ${escapeHTML(
                      row.descripcion
                    )}
                  </p>
                `
                : ""
            }

          </div>

        </div>

        <div class="detail-content">

          <div class="detail-actions">

            <button
              class="detail-action maps"
              onclick="openMaps('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                🗺️
              </span>

              <span class="detail-action-label">
                Maps
              </span>
            </button>

            <button
              class="detail-action done"
              onclick="toggleDone('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                ${isDone(row) ? "↩️" : "✅"}
              </span>

              <span class="detail-action-label">
                ${isDone(row) ? "Deshacer" : "Hecho"}
              </span>
            </button>

            <button
              class="detail-action"
              onclick="toggleSkipped('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                ${isSkipped(row) ? "↩️" : "⏭️"}
              </span>

              <span class="detail-action-label">
                ${isSkipped(row) ? "No saltar" : "Saltar"}
              </span>
            </button>

          </div>
      `;

      if (
        row.direccion
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Dirección
            </div>

            <div
              class="detail-box address-box clickable"
              onclick="openMaps('${escapeHTML(row.orden)}')"
            >

              <div class="detail-icon">
                📍
              </div>

              <div>

                <div class="address-main">
                  ${escapeHTML(
                    row.direccion
                  )}
                </div>

                ${
                  row.maps_query
                    ? `
                      <div class="address-sub">
                        ${escapeHTML(
                          row.maps_query
                        )}
                      </div>
                    `
                    : ""
                }

                <div class="address-link">
                  Abrir ubicación →
                </div>

              </div>

            </div>

          </section>
        `;
      }

      if (
        tasks.length
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Qué hacer aquí
            </div>

            <div
              class="task-list ${escapeHTML(
                row.color ||
                "c-coral"
              )}"
            >
        `;

        tasks.forEach(task => {
          html += `
            <div class="task-item">

              <span class="task-bullet"></span>

              <span>
                ${escapeHTML(task)}
              </span>

            </div>
          `;
        });

        html += `
            </div>

          </section>
        `;
      }

      if (
        price
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Precio
            </div>

            <div class="detail-box price-box">

              <div class="detail-icon">
                💰
              </div>

              <div>

                <div class="price-main">
                  ${escapeHTML(price)}
                </div>

                ${
                  conversion
                    ? `
                      <div class="price-secondary">
                        ${escapeHTML(
                          conversion
                        )}
                      </div>
                    `
                    : ""
                }

                ${
                  row.precio_nota
                    ? `
                      <div class="price-secondary">
                        ${escapeHTML(
                          row.precio_nota
                        )}
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

          </section>
        `;
      }

      if (
        row.alerta
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Importante
            </div>

            <div class="detail-box detail-alert">

              <span>
                ⚠️
              </span>

              <span>
                ${escapeHTML(
                  row.alerta
                )}
              </span>

            </div>

          </section>
        `;
      }

      html += `
        </div>

        <nav class="detail-navigation">

          <button
            class="nav-button"
            ${
              previous
                ? `onclick="openDetail('${escapeHTML(previous.orden)}')"`
                : "disabled"
            }
          >
            ← Anterior
          </button>

          <div class="nav-position">

            <span>
              Actividad
            </span>

            <strong>
              ${index + 1} de ${stops.length}
            </strong>

          </div>

          <button
            class="nav-button primary"
            ${
              next
                ? `onclick="openDetail('${escapeHTML(next.orden)}')"`
                : `onclick="closeDetail()"`
            }
          >
            ${next ? "Siguiente →" : "Cerrar ✓"}
          </button>

        </nav>
      `;

      document
        .getElementById(
          "detailContent"
        )
        .innerHTML = html;

      const view =
        document.getElementById(
          "detailView"
        );

      if (
        !view.classList.contains(
          "open"
        )
      ) {
        mainScrollPosition =
          window.scrollY;
      }

      view.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

      if (
        resetScroll
      ) {
        view.scrollTop = 0;
      }
    }

    function closeDetail() {
      currentDetailOrder =
        null;

      const view =
        document.getElementById(
          "detailView"
        );

      view.classList.remove(
        "open"
      );

      document.body.style.overflow =
        "";

      window.scrollTo(
        0,
        mainScrollPosition
      );
    }

    function shareActivity(order) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      const text = [
        row.nombre ||
          "Actividad del viaje",

        row.hora_inicio
          ? (
            "Hora: " +
            parseTime(
              row.hora_inicio
            ).display
          )
          : "",

        row.direccion || ""
      ]
        .filter(Boolean)
        .join("\n");

      if (
        navigator.share
      ) {
        navigator
          .share({
            title:
              row.nombre ||
              "Actividad",

            text,

            url:
              mapsURL(row)
          })
          .catch(() => {});
      } else if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {
        navigator.clipboard
          .writeText(
            text +
            "\n" +
            mapsURL(row)
          )
          .then(() => {
            alert(
              "Información copiada."
            );
          })
          .catch(() => {
            alert(text);
          });
      } else {
        alert(text);
      }
    }

    function loadData() {
      document
        .getElementById(
          "app"
        )
        .innerHTML = `
          <div class="loading">
            ⏳ Cargando Día 1...
          </div>
        `;

      fetch(
        API_URL +
        "?format=json&day=" +
        CURRENT_DAY
      )
        .then(response => {
          if (
            !response.ok
          ) {
            throw new Error(
              "Error HTTP " +
              response.status
            );
          }

          return response.json();
        })
        .then(data => {
          rows =
            Array.isArray(
              data &&
              data.rows
            )
              ? data.rows
              : [];

          meta =
            data &&
            data.meta
              ? data.meta
              : {};

          if (
            !rows.length
          ) {
            throw new Error(
              "El API no devolvió actividades para el Día 1."
            );
          }

          render();
        })
        .catch(error => {
          document
            .getElementById(
              "app"
            )
            .innerHTML = `
              <div class="error">

                <strong>
                  No se pudo cargar el Día 1.
                </strong>

                <br><br>

                ${escapeHTML(
                  error.message
                )}

              </div>
            `;
        });
    }

    loadData();
  </script>

</body>
</html>
