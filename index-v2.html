<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Road Trip · Seattle y Canadá 2026</title>

  <meta name="theme-color" content="#F7F7F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
<script src="./performance-patch.js?v=22"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --page: #ECEFEA;
      --background: #F7F7F3;
      --surface: #FFFFFF;
      --surface-soft: #F0F2EE;
      --surface-blue: #EAF3F8;

      --text: #202321;
      --text-soft: #505853;
      --muted: #7E8781;
      --border: rgba(32, 35, 33, 0.09);

      --primary: #202321;

      --blue: #6395B3;
      --blue-dark: #4C7891;
      --blue-soft: #E2EFF6;

      --lime: #DFFF59;
      --lime-soft: #F2FBCB;

      --coral: #EF8063;
      --coral-soft: #FCE8E1;

      --gold: #D69A32;
      --gold-soft: #FFF3D7;

      --green: #4B9C84;
      --green-soft: #E1F3ED;

      --danger: #C85F5F;
      --danger-soft: #FBEAEA;

      --shadow-small:
        0 5px 18px rgba(38, 45, 41, 0.07);

      --shadow:
        0 12px 34px rgba(38, 45, 41, 0.09);

      --shadow-strong:
        0 22px 50px rgba(38, 45, 41, 0.16);

      --safe-top:
        env(safe-area-inset-top);

      --safe-bottom:
        env(safe-area-inset-bottom);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(223, 255, 89, 0.18),
          transparent 25%
        ),
        radial-gradient(
          circle at 95% 5%,
          rgba(99, 149, 179, 0.14),
          transparent 30%
        ),
        var(--page);

      color: var(--text);

      font-family:
        "Sora",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
    }

    body {
      padding-bottom:
        calc(96px + var(--safe-bottom));
    }

    body.detail-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font-family:
        "Sora",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    article,
    .clickable {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    article:focus-visible {
      outline:
        3px solid
        rgba(99, 149, 179, 0.30);

      outline-offset: 3px;
    }

    img {
      display: block;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      background: var(--background);
    }

    .loading,
    .error {
      margin: 24px 16px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: var(--surface);
      box-shadow: var(--shadow);

      font-size: 16px;
      line-height: 1.55;
    }

    .loading {
      text-align: center;
    }

    .error {
      color: var(--danger);
      background: var(--danger-soft);
    }

    /* HERO */

    .hero {
      position: relative;
      min-height: 350px;
      overflow: hidden;

      background: #B6C6CF;
      border-radius: 0 0 38px 38px;

      box-shadow: var(--shadow-strong);
    }

    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      filter:
        brightness(0.78)
        saturate(1.02);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(14, 19, 17, 0.04),
          rgba(14, 19, 17, 0.14) 34%,
          rgba(14, 19, 17, 0.84) 100%
        );
    }

    .hero-top {
      position: relative;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        calc(16px + var(--safe-top))
        17px
        0;
    }

    .hero-icon-button {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.48);

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.24);

      color: white;

      font-size: 22px;
      font-weight: 600;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.13);
    }

    .hero-icon-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .hero-count {
      padding: 10px 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.46);

      border-radius: 24px;

      background:
        rgba(255, 255, 255, 0.23);

      color: white;

      font-size: 12px;
      font-weight: 700;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .hero-content {
      position: absolute;
      z-index: 2;

      left: 19px;
      right: 19px;
      bottom: 25px;
    }

    .hero-day {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      margin-bottom: 11px;
      padding: 7px 11px;

      border-radius: 12px;

      background: var(--lime);
      color: #252A23;

      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .hero-date {
      margin-bottom: 7px;

      color:
        rgba(255, 255, 255, 0.90);

      font-size: 16px;
      font-weight: 600;

      text-transform: capitalize;
    }

    .hero-title {
      max-width: 94%;

      color: white;

      font-size: clamp(34px, 9vw, 43px);
      font-weight: 800;

      line-height: 1.03;
      letter-spacing: -1.3px;

      text-shadow:
        0 8px 26px
        rgba(0, 0, 0, 0.22);
    }

    /* SELECTOR DE DÍAS */

    .day-selector {
      display: flex;
      gap: 8px;

      padding: 18px 16px 2px;

      overflow-x: auto;
      scrollbar-width: none;

      scroll-snap-type: x mandatory;
    }

    .day-selector::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 auto;

      min-width: 75px;
      padding: 10px 12px;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      background: var(--surface);

      color: var(--text);

      box-shadow: var(--shadow-small);

      scroll-snap-align: center;
    }

    .day-chip strong {
      display: block;

      font-size: 13px;
      font-weight: 800;
    }

    .day-chip span {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;
    }

    .day-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .day-chip.active span {
      color:
        rgba(255, 255, 255, 0.74);
    }

    .day-chip.trip-today {
      box-shadow:
        0 0 0 3px
        rgba(223, 255, 89, 0.70);
    }

    .main-content {
      padding-top: 14px;
    }

    .section-padding {
      padding-left: 16px;
      padding-right: 16px;
    }

    /* CLIMA */

    .weather-card {
      padding: 17px;

      border:
        1px solid
        var(--border);

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          #FFFFFF,
          #F3F8FA
        );

      box-shadow: var(--shadow-small);
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .weather-icon {
      width: 58px;
      height: 58px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 19px;

      background: var(--blue-soft);

      font-size: 29px;
    }

    .weather-copy {
      flex: 1;
      min-width: 0;
    }

    .weather-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .weather-label {
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .country-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      flex: 0 0 auto;

      padding: 6px 9px;

      border-radius: 12px;

      background: var(--surface-soft);
    }

    .country-flag {
      font-size: 18px;
      line-height: 1;
    }

    .country-name {
      color: var(--text-soft);

      font-size: 10px;
      font-weight: 700;

      white-space: nowrap;
    }

    .weather-value {
      margin-top: 7px;

      color: var(--text);

      font-size: 18px;
      font-weight: 800;

      line-height: 1.35;
    }

    .weather-rain {
      margin-top: 6px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }

    .weather-note {
      margin-top: 6px;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.4;
    }

    /* SIGUIENTE */

    .next-section {
      margin-top: 13px;
    }

    .next-card {
      position: relative;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        104px;

      gap: 15px;
      align-items: stretch;

      min-height: 154px;

      overflow: hidden;
      padding: 17px;

      border:
        1px solid
        rgba(32, 35, 33, 0.09);

      border-radius: 27px;

      background:
        linear-gradient(
          135deg,
          var(--lime-soft),
          #FFFFFF 72%
        );

      box-shadow: var(--shadow);

      cursor: pointer;
    }

    .next-card:active {
      transform: scale(0.99);
    }

    .next-content {
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .next-label {
      display: inline-flex;
      align-items: center;

      width: fit-content;

      margin-bottom: 9px;
      padding: 6px 9px;

      border-radius: 9px;

      background: var(--lime);
      color: #343A2E;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .next-name {
      color: var(--text);

      font-size: 21px;
      font-weight: 800;

      line-height: 1.20;
      letter-spacing: -0.4px;
    }

    .next-time {
      margin-top: 8px;

      color: var(--text-soft);

      font-size: 14px;
      font-weight: 600;

      line-height: 1.4;
    }

    .next-media {
      position: relative;
      min-height: 120px;
    }

    .next-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 21px;

      background: var(--surface-soft);
    }

    .next-arrow {
      position: absolute;

      right: 8px;
      bottom: 8px;

      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--primary);
      color: white;

      font-size: 22px;

      box-shadow:
        0 6px 15px
        rgba(0, 0, 0, 0.18);
    }

    /* ALERTA */

    .alert-section {
      margin-top: 13px;
    }

    .alert-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;

      padding: 14px 15px;

      border:
        1px solid
        rgba(200, 95, 95, 0.17);

      border-radius: 20px;

      background: var(--danger-soft);
    }

    .alert-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      border-radius: 14px;

      background:
        rgba(200, 95, 95, 0.11);

      font-size: 20px;
    }

    .alert-title {
      margin-bottom: 3px;

      color: #994A4A;

      font-size: 15px;
      font-weight: 800;
    }

    .alert-text {
      color: #755F5F;

      font-size: 13px;
      line-height: 1.48;
    }

    /* ITINERARIO */

    .itinerary-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;

      padding:
        29px
        16px
        14px;
    }

    .itinerary-heading h2 {
      color: var(--text);

      font-size: 30px;
      font-weight: 800;

      letter-spacing: -0.9px;
    }

    .itinerary-count {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }

    .itinerary-list {
      padding:
        0 16px 28px;
    }

    /* ACTIVIDAD */

    .activity-card {
      margin-bottom: 14px;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 27px;

      background: var(--surface);

      box-shadow: var(--shadow-small);

      cursor: pointer;

      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .activity-card:active {
      transform: scale(0.987);

      box-shadow:
        0 4px 16px
        rgba(38, 45, 41, 0.06);
    }

    .activity-card.done {
      opacity: 0.52;
    }

    .activity-card.skipped {
      opacity: 0.33;
    }

    .activity-inner {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        104px;

      gap: 15px;
      align-items: stretch;

      min-height: 148px;

      padding: 16px;
    }

    .activity-copy {
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .activity-topline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 11px;
    }

    .activity-time {
      color: var(--text);

      font-size: 15px;
      font-weight: 800;
    }

    .activity-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      padding: 6px 9px;

      border-radius: 10px;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .c-coral .activity-tag {
      color: #B45943;
      background: var(--coral-soft);
    }

    .c-gold .activity-tag {
      color: #96671E;
      background: var(--gold-soft);
    }

    .c-mint .activity-tag {
      color: #337A66;
      background: var(--green-soft);
    }

    .c-sky .activity-tag {
      color: #4E7D98;
      background: var(--blue-soft);
    }

    .activity-title {
      color: var(--text);

      font-size: 20px;
      font-weight: 800;

      line-height: 1.23;
      letter-spacing: -0.4px;
    }

    .activity-description {
      margin-top: 7px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.48;

      overflow: hidden;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .activity-media {
      position: relative;
      min-height: 116px;
    }

    .activity-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 21px;

      background: var(--surface-soft);
    }

    .activity-chevron {
      position: absolute;

      right: 8px;
      bottom: 8px;

      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        rgba(32, 35, 33, 0.88);

      color: white;

      font-size: 22px;

      box-shadow:
        0 5px 15px
        rgba(0, 0, 0, 0.18);
    }

    /* TRASLADOS */

    .transit-card {
      display: grid;
      grid-template-columns:
        44px minmax(0, 1fr) auto;

      gap: 12px;
      align-items: center;

      margin: 2px 5px 14px;
      padding: 14px;

      border:
        1px solid
        rgba(99, 149, 179, 0.16);

      border-left:
        4px solid var(--blue);

      border-radius:
        0 20px 20px 0;

      background:
        rgba(99, 149, 179, 0.08);
    }

    .transit-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background:
        rgba(99, 149, 179, 0.13);

      font-size: 22px;
    }

    .transit-copy {
      min-width: 0;
    }

    .transit-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 5px;
    }

    .transit-duration {
      color: var(--blue-dark);

      font-size: 15px;
      font-weight: 800;
    }

    .transit-mode {
      padding: 4px 7px;

      border-radius: 8px;

      background: var(--surface);

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;
    }

    .transit-title {
      color: var(--text);

      font-size: 15px;
      font-weight: 800;

      line-height: 1.4;
    }

    .transit-description {
      margin-top: 3px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.45;
    }

    .transit-map-button {
      min-width: 58px;
      min-height: 54px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;
      padding: 7px;

      border:
        1px solid
        rgba(99, 149, 179, 0.24);

      border-radius: 17px;

      background: var(--surface);
      color: var(--blue-dark);

      font-size: 18px;
    }

    .transit-map-button span {
      font-size: 10px;
      font-weight: 800;
    }

    /* HOTEL */

    .hotel-section {
      margin-top: 26px;
    }

    .hotel-label {
      margin-bottom: 11px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .hotel-card {
      display: grid;
      grid-template-columns:
        56px minmax(0, 1fr);

      gap: 14px;
      align-items: flex-start;

      padding: 17px;

      border:
        1px solid
        rgba(99, 149, 179, 0.18);

      border-radius: 24px;

      background: var(--surface-blue);

      box-shadow: var(--shadow-small);
    }

    .hotel-icon {
      width: 56px;
      height: 56px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background:
        rgba(99, 149, 179, 0.13);

      font-size: 25px;
    }

    .hotel-name {
      color: var(--text);

      font-size: 17px;
      font-weight: 800;

      line-height: 1.35;
    }

    .hotel-description {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.47;
    }

    .hotel-button {
      margin-top: 12px;
      padding: 10px 14px;

      border:
        1px solid
        rgba(99, 149, 179, 0.24);

      border-radius: 19px;

      background:
        rgba(99, 149, 179, 0.11);

      color: var(--blue-dark);

      font-size: 13px;
      font-weight: 800;
    }

    /* BARRA INFERIOR */

    .bottom-navigation {
      position: fixed;
      z-index: 60;

      left: 0;
      right: 0;
      bottom: 0;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        auto
        minmax(0, 1fr);

      gap: 10px;
      align-items: center;

      padding:
        11px 16px
        calc(11px + var(--safe-bottom));

      border-top:
        1px solid
        var(--border);

      background:
        rgba(250, 250, 247, 0.95);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 -10px 28px
        rgba(38, 45, 41, 0.08);
    }

    .nav-button {
      min-width: 0;
      min-height: 52px;

      padding: 11px 13px;

      border:
        1px solid
        var(--border);

      border-radius: 27px;

      background: var(--surface);
      color: var(--text);

      font-size: 14px;
      font-weight: 800;

      white-space: nowrap;
    }

    .nav-button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.27;
      cursor: default;
    }

    .nav-position {
      min-width: 70px;
      text-align: center;
    }

    .nav-position span {
      display: block;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .nav-position strong {
      display: block;

      margin-top: 3px;

      color: var(--text);

      font-size: 15px;
      font-weight: 800;
    }

    /* DETALLE */

    .detail-view {
      position: fixed;
      z-index: 100;

      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow-y: auto;
      overflow-x: hidden;

      background:
        linear-gradient(
          to bottom,
          #FAFBF8,
          var(--background)
        );

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.22s ease,
        visibility 0.22s ease;

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .detail-view.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .detail-hero {
      position: relative;

      min-height: 400px;

<body>

  <main class="app" id="app">
    <div class="loading">
      ⏳ Cargando itinerario...
    </div>
  </main>

  <section class="detail-view" id="detailView">
    <div id="detailContent"></div>
  </section>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRjW3k_a-b7btvbmVVbdarfJIUSf4Q3erwqGJf0V6PnFFnOjg1WryzXJmh2Lqywlq6Jg/exec";

    const TRIP_DAYS = {
      1: {
        date: "2026-08-10",
        shortDate: "10 AGO",
        city: "SeaTac",
        latitude: 47.4447,
        longitude: -122.3138,

      },

      2: {

        latitude: 47.6062,
        longitude: -122.3321,
        timezone: "America/Los_Angeles",
        flag: "🇺🇸",

      },

      3: {
        date: "2026-08-12",
        shortDate: "12 AGO",
        city: "Bainbridge / Centralia",
        latitude: 47.6262,
        longitude: -122.5212,
        timezone: "America/Los_Angeles",
        flag: "🇺🇸",
        country: "Estados Unidos"
      },

      4: {
        date: "2026-08-13",
        shortDate: "13 AGO",
        city: "Portland",
        latitude: 45.5152,
        longitude: -122.6784,
        timezone: "America/Los_Angeles",
        flag: "🇺🇸",
        country: "Estados Unidos"
      },

      5: {
        date: "2026-08-14",
        shortDate: "14 AGO",
        city: "Victoria",
        latitude: 48.4284,
        longitude: -123.3656,
        timezone: "America/Vancouver",
        flag: "🇨🇦",
        country: "Canadá"
      },

      6: {
        date: "2026-08-15",
        shortDate: "15 AGO",
        city: "Whistler",
        latitude: 50.1163,
        longitude: -122.9574,
        timezone: "America/Vancouver",
        flag: "🇨🇦",
        country: "Canadá"
      },

      7: {
        date: "2026-08-16",
        shortDate: "16 AGO",
        city: "Vancouver",
        latitude: 49.2827,
        longitude: -123.1207,
        timezone: "America/Vancouver",
        flag: "🇨🇦",
        country: "Canadá"
      },

      8: {
        date: "2026-08-17",
        shortDate: "17 AGO",
        city: "Vancouver / Washington",
        latitude: 49.2827,
        longitude: -123.1207,
        timezone: "America/Vancouver",
        flag: "🇨🇦 → 🇺🇸",
        country: "Canadá a EE. UU."
      },

      9: {
        date: "2026-08-18",
        shortDate: "18 AGO",
        city: "Washington",
        latitude: 47.0379,
        longitude: -122.9007,
        timezone: "America/Los_Angeles",
        flag: "🇺🇸",
        country: "Estados Unidos"
      }
    };

    let currentDay =
      getAutomaticTripDay();

    let rows = [];
    let meta = {};

    let weatherData = null;
    let weatherUpdatedAt = null;

    let currentDetailOrder = null;
    let mainScrollPosition = 0;

    function escapeHTML(value) {
      return String(
        value == null
          ? ""
          : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function localDateString(date) {
      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      return (
        year +
        "-" +
        month +
        "-" +
        day
      );
    }

    function getAutomaticTripDay() {
      const today =
        localDateString(
          new Date()
        );

      for (
        let day = 1;
        day <= 9;
        day++
      ) {
        if (
          TRIP_DAYS[day].date ===
          today
        ) {
          return day;
        }
      }

      if (
        today <
        TRIP_DAYS[1].date
      ) {
        return 1;
      }

      if (
        today >
        TRIP_DAYS[9].date
      ) {
        return 9;
      }

      return 1;
    }

    function actualTripDay() {
      const today =
        localDateString(
          new Date()
        );

      for (
        let day = 1;
        day <= 9;
        day++
      ) {
        if (
          TRIP_DAYS[day].date ===
          today
        ) {
          return day;
        }
      }

      return null;
    }

    function rowType(row) {
      return String(
        row.tipo || "stop"
      ).toLowerCase();
    }

    function getRow(order) {
      return rows.find(
        row =>
          String(row.orden) ===
          String(order)
      );
    }

    function getStops() {
      return rows.filter(
        row =>
          rowType(row) ===
          "stop"
      );
    }

    function getNight() {
      return rows.find(
        row =>
          rowType(row) ===
          "night"
      );
    }

    function getFirstAlert() {
      return rows.find(
        row =>
          row.alerta
      );
    }

    function stateKey(order, state) {
      return (
        "roadtrip_v2_day_" +
        currentDay +
        "_" +
        order +
        "_" +
        state
      );
    }

    function isDone(row) {
      return (
        localStorage.getItem(
          stateKey(
            row.orden,
            "done"
          )
        ) === "1"
      );
    }

    function isSkipped(row) {
      return (
        localStorage.getItem(
          stateKey(
            row.orden,
            "skipped"
          )
        ) === "1"
      );
    }

    function toggleDone(order) {
      const row =
        getRow(order);

      if (!row) return;

      const doneKey =
        stateKey(
          order,
          "done"
        );

      const skippedKey =
        stateKey(
          order,
          "skipped"
        );

      if (
        localStorage.getItem(
          doneKey
        ) === "1"
      ) {
        localStorage.removeItem(
          doneKey
        );
      } else {
        localStorage.setItem(
          doneKey,
          "1"
        );

        localStorage.removeItem(
          skippedKey
        );

        if (
          navigator.vibrate
        ) {
          navigator.vibrate(40);
        }
      }

      render();

      if (
        currentDetailOrder !== null
      ) {
        openDetail(
          currentDetailOrder,
          false
        );
      }
    }

    function toggleSkipped(order) {
      const row =
        getRow(order);

      if (!row) return;

      const skippedKey =
        stateKey(
          order,
          "skipped"
        );

      const doneKey =
        stateKey(
          order,
          "done"
        );

      if (
        localStorage.getItem(
          skippedKey
        ) === "1"
      ) {
        localStorage.removeItem(
          skippedKey
        );
      } else {
        localStorage.setItem(
          skippedKey,
          "1"
        );

        localStorage.removeItem(
          doneKey
        );
      }

      render();

      if (
        currentDetailOrder !== null
      ) {
        openDetail(
          currentDetailOrder,
          false
        );
      }
    }

    function parseTime(value) {
      const text =
        String(
          value || ""
        ).trim();

      const match =
        text.match(
          /(\d{1,2}):(\d{2})/
        );

      if (!match) {
        return {
          display:
            text ||
            "Horario flexible",

          minutes: null
        };
      }

      let originalHour =
        Number(match[1]);

      const minutes =
        Number(match[2]);

      const lowerText =
        text.toLowerCase();

      if (
        lowerText.includes("pm") &&
        originalHour !== 12
      ) {
        originalHour += 12;
      }

      if (
        lowerText.includes("am") &&
        originalHour === 12
      ) {
        originalHour = 0;
      }

      const displayHour =
        originalHour % 12 || 12;

      const suffix =
        originalHour >= 12
          ? "p.m."
          : "a.m.";

      return {
        display:
          displayHour +
          ":" +
          String(minutes)
            .padStart(2, "0") +
          " " +
          suffix,

        minutes:
          originalHour * 60 +
          minutes
      };
    }

    function currentMinutes() {
      const now =
        new Date();

      return (
        now.getHours() * 60 +
        now.getMinutes()
      );
    }

    function splitTasks(value) {
      if (!value) {
        return [];
      }

      return String(value)
        .split("|")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);
    }

    function numberValue(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      const number =
        Number(
          String(value)
            .replace(",", ".")
        );

      return Number.isNaN(number)
        ? null
        : number;
    }

    function formatMoney(number) {
      return Math
        .round(number)
        .toLocaleString(
          "es-MX"
        );
    }

    function getCurrencyRate(currency) {
      const exchange =
        meta.exchange || {};

      if (
        currency === "USD"
      ) {
        return Number(
          exchange.USD_MXN || 0
        );
      }

      if (
        currency === "CAD"
      ) {
        return Number(
          exchange.CAD_MXN || 0
        );
      }

      if (
        currency === "MXN"
      ) {
        return 1;
      }

      return 0;
    }

    function formatDate(value) {
      const source =
        value ||
        TRIP_DAYS[currentDay].date;

      const match =
        String(source).match(
          /(\d{4})-(\d{2})-(\d{2})/
        );

      if (!match) {
        return source;
      }

      const date =
        new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        );

      return new Intl
        .DateTimeFormat(
          "es-MX",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        )
        .format(date);
    }

    function getNextStop() {
      const pending =
        getStops().filter(
          row =>
            !isDone(row) &&
            !isSkipped(row)
        );

      if (!pending.length) {
        return null;
      }

      const todayDay =
        actualTripDay();

      if (
        todayDay !== currentDay
      ) {
        return pending[0];
      }

      const now =
        currentMinutes();

      for (
        const row of pending
      ) {
        const end =
          parseTime(
            row.hora_fin
          ).minutes;

        const start =
          parseTime(
            row.hora_inicio
          ).minutes;

        const reference =
          end !== null
            ? end
            : start;

        if (
          reference !== null &&
          reference >= now
        ) {
          return row;
        }
      }

      return pending[0];
    }

    function getTimeStatus(row) {
      const todayDay =
        actualTripDay();

      if (
        todayDay !== currentDay
      ) {
        const time =
          parseTime(
            row.hora_inicio
          ).display;

        return (
          time ===
          "Horario flexible"
            ? time
            : "A las " + time
        );
      }

      const start =
        parseTime(
          row.hora_inicio
        ).minutes;

      const end =
        parseTime(
          row.hora_fin
        ).minutes;

      const now =
        currentMinutes();

      if (
        start === null
      ) {
        return "Horario flexible";
      }

      if (
        now < start
      ) {
        const remaining =
          start - now;

        if (
          remaining < 60
        ) {
          return (
            "Empieza en " +
            remaining +
            " min"
          );
        }

        return (
          "A las " +
          parseTime(
            row.hora_inicio
          ).display
        );
      }

      if (
        end !== null &&
        now > end
      ) {
        return (
          "Esta actividad ya pasó"
        );
      }

      return (
        "Corresponde hacerla ahora"
      );
    }

    function heroImage() {
      const next =
        getNextStop();

      if (
        next &&
        next.imagen
      ) {
        return next.imagen;
      }

      const first =
        getStops().find(
          row =>
            row.imagen
        );

      return first
        ? first.imagen
        : "https://images.unsplash.com/photo-1502175353174-a7a70e73b362?w=1200&q=85";
    }

    function mapsURL(row) {
      const query =
        row.maps_query ||
        row.direccion ||
        row.nombre ||
        "";

      return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query)
      );
    }

    function openMaps(order) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      window.open(
        mapsURL(row),
        "_blank"
      );
    }

    /* TRASLADOS */

    function transportInfo(row) {
      const text = [
        row.categoria,
        row.nombre,
        row.descripcion,
        row.emoji
      ]
        .join(" ")
        .toLowerCase();

      if (
        text.includes("camin") ||
        text.includes("walking") ||
        text.includes("🚶")
      ) {
        return {
          icon: "🚶",
          label: "Caminando",
          mode: "walking"
        };
      }

      if (
        text.includes("tren") ||
        text.includes("rail") ||
        text.includes("monorriel") ||
        text.includes("metro") ||
        text.includes("🚈") ||
        text.includes("🚝") ||
        text.includes("🚆")
      ) {
        return {
          icon: "🚈",
          label: "Transporte público",
          mode: "transit"
        };
      }

      if (
        text.includes("ferry") ||
        text.includes("bote") ||
        text.includes("aquabus") ||
        text.includes("⛴") ||
        text.includes("🛥")
      ) {
        return {
          icon: "⛴️",
          label: "Ferry",
          mode: "transit"
        };
      }

      if (
        text.includes("shuttle") ||
        text.includes("van") ||
        text.includes("🚐")
      ) {
        return {
          icon: "🚐",
          label: "Shuttle",
          mode: "driving"
        };
      }

      return {
        icon: "🚗",
        label: "En auto",
        mode: "driving"
      };
    }

    function transitDuration(row) {
      if (
        row.duracion
      ) {
        return String(
          row.duracion
        )
          .replace(/^~/, "")
          .trim();
      }

      const start =
        parseTime(
          row.hora_inicio
        ).minutes;

      const end =
        parseTime(
          row.hora_fin
        ).minutes;

      if (
        start === null ||
        end === null
      ) {
        return "Tiempo por confirmar";
      }

      let minutes =
        end - start;

      if (
        minutes < 0
      ) {
        minutes +=
          24 * 60;
      }

      if (
        minutes >= 60
      ) {
        const hours =
          Math.floor(
            minutes / 60
          );

        const remainder =
          minutes % 60;

        return remainder
          ? (
            hours +
            " h " +
            remainder +
            " min"
          )
          : (
            hours +
            " h"
          );
      }

      return (
        minutes +
        " min"
      );
    }

    function transitDestination(row) {
      if (
        row.maps_query
      ) {
        return row.maps_query;
      }

      if (
        row.direccion
      ) {
        return row.direccion;
      }

      const name =
        String(
          row.nombre || ""
        );

      if (
        name.includes("→")
      ) {
        return name
          .split("→")
          .pop()
          .trim();
      }

      return name;
    }

    function transitOrigin(row) {
      const name =
        String(
          row.nombre || ""
        );

      if (
        name.includes("→")
      ) {
        return name
          .split("→")[0]
          .trim();
      }

      return "";
    }

    function transitMapsURL(row) {
      const transport =
        transportInfo(row);

      const destination =
        transitDestination(row);

      const origin =
        transitOrigin(row);

      let url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        encodeURIComponent(
          destination
        ) +
        "&travelmode=" +
        encodeURIComponent(
          transport.mode
        );

      if (
        origin
      ) {
        url +=
          "&origin=" +
          encodeURIComponent(
            origin
          );
      }

      return url;
    }

    function openTransitMaps(order) {
      const row =
        getRow(order);

      if (!row) {

    function weatherDescription(code) {
      const descriptions = {
        0: "Despejado",
        1: "Mayormente despejado",
        2: "Parcialmente nublado",
        3: "Nublado",
        45: "Con niebla",
        48: "Con niebla",
        51: "Llovizna ligera",
        53: "Llovizna",
        55: "Llovizna intensa",
        61: "Lluvia ligera",
        63: "Lluvia",
        65: "Lluvia intensa",
        71: "Nieve ligera",
        73: "Nieve",
        75: "Nieve intensa",
        80: "Chubascos ligeros",
        81: "Chubascos",
        82: "Chubascos intensos",
        95: "Tormenta",
        96: "Tormenta con granizo",
        99: "Tormenta intensa"
      };

      return (
        descriptions[code] ||
        "Condiciones variables"
      );
    }

    function weatherIcon(code) {
      if (
        code === 0
      ) {
        return "☀️";
      }

      if (
        code === 1 ||
        code === 2
      ) {
        return "🌤️";
      }

      if (
        code === 3
      ) {
        return "☁️";
      }

      if (
        code === 45 ||
        code === 48
      ) {
        return "🌫️";
      }

      if (
        [
          51, 53, 55,
          61, 63, 65,
          80, 81, 82
        ].includes(code)
      ) {
        return "🌧️";
      }

      if (
        [71, 73, 75]
          .includes(code)
      ) {
        return "🌨️";
      }

      if (
        [95, 96, 99]
          .includes(code)
      ) {
        return "⛈️";
      }

      return "🌤️";
    }

    function fetchWeather() {
      const config =
        TRIP_DAYS[currentDay];

      weatherData = {
        loading: true,
        available: false
      };

      weatherUpdatedAt =
        null;

      const dailyVariables = [
        "weather_code",
        "temperature_2m_max",
        "temperature_2m_min",
        "precipitation_probability_max"
      ].join(",");

      const currentVariables = [
        "temperature_2m",
        "apparent_temperature",
        "weather_code"
      ].join(",");

      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" +
        config.latitude +
        "&longitude=" +
        config.longitude +
        "&daily=" +
        dailyVariables +
        "&current=" +
        currentVariables +
        "&temperature_unit=celsius" +
        "&timezone=" +
        encodeURIComponent(
          config.timezone
        ) +
        "&forecast_days=16";

      return fetch(url)
        .then(response => {
          if (
            !response.ok
          ) {
            throw new Error(
              "No se pudo consultar el clima."
            );
          }

          return response.json();
        })
        .then(data => {
          const dates =
            data.daily &&
            Array.isArray(
              data.daily.time
            )
              ? data.daily.time
              : [];

          const index =
            dates.indexOf(
              config.date
            );

          if (
            index === -1
          ) {
            weatherData = {
              loading: false,
              available: false,
              message:
                "Pronóstico disponible más cerca de la fecha"
            };

            return;
          }

          weatherData = {
            loading: false,
            available: true,

            code:
              data.daily
                .weather_code[index],

            maximum:
              Math.round(
                data.daily
                  .temperature_2m_max[index]
              ),

            minimum:
              Math.round(
                data.daily
                  .temperature_2m_min[index]
              ),

            rain:
              Math.round(
                data.daily
                  .precipitation_probability_max[index] ||
                0
              ),

            current:
              data.current &&
              typeof data.current
                .temperature_2m ===
                "number"
                ? Math.round(
                    data.current
                      .temperature_2m
                  )
                : null,

            apparent:
              data.current &&
              typeof data.current
                .apparent_temperature ===
                "number"
                ? Math.round(
                    data.current
                      .apparent_temperature
                  )
                : null
          };

          weatherUpdatedAt =
            new Date();
        })
        .catch(() => {
          weatherData = {
            loading: false,
            available: false,
            message:
              "No se pudo actualizar el pronóstico"
          };

          weatherUpdatedAt =
            null;
        });
    }

    function weatherMainText() {
      if (
        !weatherData ||

      if (

        return (

      }

      return (

    function getPriceConversion(row) {
      const minimum =
        numberValue(
          row.precio_monto
        );

      const maximum =
        numberValue(
          row.precio_monto_max
        );

      const currency =
        String(
          row.moneda || ""
        )
          .toUpperCase()
          .trim();

      const rate =
        getCurrencyRate(
          currency
        );

      if (
        !rate ||
        minimum === null
      ) {
        return "";
      }

      const minimumMXN =
        minimum * rate;

      const maximumMXN =
        (
          maximum !== null
            ? maximum
            : minimum
        ) * rate;

      if (
        maximumMXN >
        minimumMXN
      ) {
        return (
          "Aprox. $" +
          formatMoney(
            minimumMXN
          ) +
          "–$" +
          formatMoney(
            maximumMXN
          ) +
          " MXN"
        );
      }

      return (
        "Aprox. $" +
        formatMoney(
          minimumMXN
        ) +
        " MXN"
      );
    }

                : ""
            }

          </div>

        </div>

        <div class="detail-content">

          <div class="detail-actions">

            <button
              class="detail-action maps"
              onclick="openMaps('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                🗺️
              </span>

              <span class="detail-action-label">
                Maps
              </span>
            </button>

            <button
              class="detail-action done"
              onclick="toggleDone('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                ${isDone(row) ? "↩️" : "✅"}
              </span>

              <span class="detail-action-label">
                ${isDone(row) ? "Deshacer" : "Hecho"}
              </span>
            </button>

            <button
              class="detail-action"
              onclick="toggleSkipped('${escapeHTML(row.orden)}')"
            >
              <span class="detail-action-icon">
                ${isSkipped(row) ? "↩️" : "⏭️"}
              </span>

              <span class="detail-action-label">
                ${isSkipped(row) ? "No saltar" : "Saltar"}
              </span>
            </button>

          </div>
      `;

      if (
        row.direccion
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Dirección
            </div>

            <div
              class="detail-box address-box clickable"
              onclick="openMaps('${escapeHTML(row.orden)}')"
            >

              <div class="detail-icon">
                📍
              </div>

              <div>

                <div class="address-main">
                  ${escapeHTML(
                    row.direccion
                  )}
                </div>

                ${
                  row.maps_query
                    ? `
                      <div class="address-sub">
                        ${escapeHTML(
                          row.maps_query
                        )}
                      </div>
                    `
                    : ""
                }

                <div class="address-link">
                  Abrir ubicación →
                </div>

              </div>

            </div>

          </section>
        `;
      }

      if (
        taskItems.length
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Qué hacer aquí
            </div>

            <div
              class="task-list ${escapeHTML(
                row.color ||
                "c-coral"
              )}"
            >
        `;

        taskItems.forEach(task => {
          html += `
            <div class="task-item">

              <span class="task-bullet"></span>

              <span>
                ${escapeHTML(task)}
              </span>

            </div>
          `;
        });

        html += `
            </div>

          </section>
        `;
      }

      if (
        price
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Precio
            </div>

            <div class="detail-box price-box">

              <div class="detail-icon">
                💰
              </div>

              <div>

                <div class="price-main">
                  ${escapeHTML(price)}
                </div>

                ${
                  conversion
                    ? `
                      <div class="price-secondary">
                        ${escapeHTML(
                          conversion
                        )}
                      </div>
                    `
                    : ""
                }

                ${
                  row.precio_nota
                    ? `
                      <div class="price-secondary">
                        ${escapeHTML(
                          row.precio_nota
                        )}
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

          </section>
        `;
      }

      if (
        row.alerta
      ) {
        html += `
          <section class="detail-section">

            <div class="detail-section-label">
              Importante
            </div>

            <div class="detail-box detail-alert">

              <span>
                ⚠️
              </span>

              <span>
                ${escapeHTML(
                  row.alerta
                )}
              </span>

            </div>

          </section>
        `;
      }

      html += `
        </div>

        <nav class="detail-navigation">

          <button
            class="nav-button"
            ${
              previous
                ? `onclick="openDetail('${escapeHTML(previous.orden)}')"`
                : "disabled"
            }
          >
            ← Anterior
          </button>

          <div class="nav-position">

            <span>
              Actividad
            </span>

            <strong>
              ${index + 1} de ${stops.length}
            </strong>

          </div>

          <button
            class="nav-button primary"
            ${
              next
                ? `onclick="openDetail('${escapeHTML(next.orden)}')"`
                : `onclick="closeDetail()"`
            }
          >
            ${next ? "Siguiente →" : "Cerrar ✓"}
          </button>

        </nav>
      `;

      document
        .getElementById(
          "detailContent"
        )
        .innerHTML = html;

      const view =
        document.getElementById(
          "detailView"
        );

      if (
        !view.classList.contains(
          "open"
        )
      ) {
        mainScrollPosition =
          window.scrollY;
      }

      view.classList.add(
        "open"
      );

      document.body.classList.add(
        "detail-open"
      );

      if (
        resetScroll
      ) {
        view.scrollTop = 0;
      }
    }

    function closeDetail(
      restoreScroll = true
    ) {
      currentDetailOrder =
        null;

      const view =
        document.getElementById(
          "detailView"
        );

      view.classList.remove(
        "open"
      );

      document.body.classList.remove(
        "detail-open"
      );

      if (
        restoreScroll
      ) {
        window.scrollTo(
          0,
          mainScrollPosition
        );
      }
    }

    function shareActivity(order) {
      const row =
        getRow(order);

      if (!row) {
        return;
      }

      const text = [
        row.nombre ||
          "Actividad del viaje",

        row.hora_inicio
          ? (
            "Hora: " +
            parseTime(
              row.hora_inicio
            ).display
          )
          : "",

        row.direccion || ""
      ]
        .filter(Boolean)
        .join("\n");

      if (
        navigator.share
      ) {
        navigator
          .share({
            title:
              row.nombre ||
              "Actividad",

            text,

            url:
              mapsURL(row)
          })
          .catch(() => {});
      } else if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {
        navigator.clipboard
          .writeText(
            text +
            "\n" +
            mapsURL(row)
          )
          .then(() => {
            alert(
              "Información copiada."
            );
          })
          .catch(() => {
            alert(text);
          });
      } else {
        alert(text);
      }
    }

    function loadData() {
      document
        .getElementById(
          "app"
        )
        .innerHTML = `
          <div class="loading">
            ⏳ Cargando Día ${currentDay}...
          </div>
        `;

      const itineraryRequest =
        fetch(
          API_URL +
          "?format=json&day=" +
          currentDay +
          "&t=" +
          Date.now()
        )
          .then(response => {
            if (
              !response.ok
            ) {
              throw new Error(
                "Error HTTP " +
                response.status
              );
            }

            return response.json();
          });

      const weatherRequest =
        fetchWeather();

      Promise
        .all([
          itineraryRequest,
          weatherRequest
        ])
        .then(results => {
          const data =
            results[0];

          rows =
            Array.isArray(
              data &&
              data.rows
            )
              ? data.rows
              : [];

          meta =
            data &&
            data.meta
              ? data.meta
              : {};

          if (
            !rows.length
          ) {
            throw new Error(
              "El API no devolvió actividades para el Día " +
              currentDay +
              "."
            );
          }

          render();
        })
        .catch(error => {
          document
            .getElementById(
              "app"
            )
            .innerHTML = `
              <div class="error">

                <strong>
                  No se pudo cargar el Día ${currentDay}.
                </strong>

                <br><br>

                ${escapeHTML(
                  error.message
                )}

              </div>
            `;
        });
    }

    loadData();
  </script>

</body>
</html>
